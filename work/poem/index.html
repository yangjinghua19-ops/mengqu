<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>古诗诗画 · 小班</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1a15;color:#eef5f0}
.list{padding:18px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#8fa89a;font-size:13px;margin-bottom:18px}
.card{display:flex;gap:12px;align-items:center;background:#17241d;border-radius:16px;padding:10px;margin-bottom:12px;text-decoration:none;color:inherit}
.card img{width:78px;height:78px;object-fit:cover;border-radius:12px;flex:0 0 auto}
.card b{display:block;font-size:17px;margin-bottom:3px}
.card small{color:#8fa89a;font-size:12.5px;display:block}
.card i{font-style:normal;color:#a9c3b4;font-size:12px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span.ar{margin-left:auto;color:#5d7a6a;font-size:18px}
/* 播放器 */
#player{position:fixed;inset:0;background:#0b120e;display:none;flex-direction:column}
#player.on{display:flex}
.stage{position:relative;flex:1;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16)}}
.head{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 30px;
 background:linear-gradient(#0009,transparent);text-align:center;pointer-events:none}
.head b{font-size:19px;letter-spacing:3px}
.head small{display:block;color:#c9d8cf;font-size:12.5px;margin-top:5px;letter-spacing:1px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:60px 18px calc(16px + env(safe-area-inset-bottom));
 background:linear-gradient(transparent,#000a 55%);text-align:center}
.line{font-size:clamp(24px,7.2vw,34px);letter-spacing:4px;font-weight:600;text-shadow:0 2px 12px #0008}
.py{color:#c6d8cd;font-size:14px;margin-top:8px;letter-spacing:1px}
.dots{display:flex;gap:7px;justify-content:center;margin:14px 0 10px}
.dots i{width:7px;height:7px;border-radius:50%;background:#ffffff55}
.dots i.on{background:#8fe0a8;width:18px;border-radius:4px}
.ctrl{display:flex;gap:10px;justify-content:center}
.ctrl button{flex:1;max-width:150px;border:0;border-radius:14px;padding:13px 0;font-size:15px;font-weight:600;color:#0f1a15;background:#d9e8de}
.ctrl button.main{background:#7ec98f}
.ctrl button:disabled{opacity:.35}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:34px;height:34px;border-radius:50%;
 background:#0006;border:0;color:#fff;font-size:17px}
</style></head><body>
<div class="list" id="list">
  <h1>古诗诗画</h1>
  <div class="sub">小班 · 10 首 · 一句一画，听着看</div>
  <div id="cards"></div>
</div>
<div id="player">
  <div class="stage" id="stage"></div>
  <button class="close" onclick="stopPlay()">✕</button>
  <div class="head"><b id="ptitle"></b><small id="pauthor"></small></div>
  <div class="foot">
    <div class="line" id="pline"></div>
    <div class="py" id="ppy"></div>
    <div class="dots" id="dots"></div>
    <div class="ctrl">
      <button id="prev" onclick="prevLine()">上一句</button>
      <button class="main" id="toggle" onclick="togglePlay()">暂停</button>
      <button id="next" onclick="nextLine()">下一句</button>
    </div>
  </div>
</div>
<script>
const POEMS = [{"t": "咏鹅", "a": "骆宾王", "slug": "yonge", "lines": ["鹅，鹅，鹅，", "曲项向天歌。", "白毛浮绿水，", "红掌拨清波。"], "py": ["é é é", "qū xiàng xiàng tiān gē", "bái máo fú lǜ shuǐ", "hóng zhǎng bō qīng bō"], "tr": "大白鹅弯着脖子，朝着天空大声唱歌；白羽毛漂在绿水上，红脚掌划开清清的水波。", "tag": "动物", "em": "🦢"}, {"t": "静夜思", "a": "李白", "slug": "jys", "lines": ["床前明月光，", "疑是地上霜。", "举头望明月，", "低头思故乡。"], "py": ["chuáng qián míng yuè guāng", "yí shì dì shàng shuāng", "jǔ tóu wàng míng yuè", "dī tóu sī gù xiāng"], "tr": "床前的月光白白的，像地上铺了一层霜；我抬头看看月亮，低下头就想起了老家。", "tag": "月亮", "em": "🌙"}, {"t": "春晓", "a": "孟浩然", "slug": "chunxiao", "lines": ["春眠不觉晓，", "处处闻啼鸟。", "夜来风雨声，", "花落知多少。"], "py": ["chūn mián bù jué xiǎo", "chù chù wén tí niǎo", "yè lái fēng yǔ shēng", "huā luò zhī duō shǎo"], "tr": "春天睡得真香，天亮了都不知道；醒来听见处处鸟叫，想起夜里的风雨，不知打落了多少花。", "tag": "春天", "em": "🌸"}, {"t": "悯农", "a": "李绅", "slug": "minnong", "lines": ["锄禾日当午，", "汗滴禾下土。", "谁知盘中餐，", "粒粒皆辛苦。"], "py": ["chú hé rì dāng wǔ", "hàn dī hé xià tǔ", "shuí zhī pán zhōng cān", "lì lì jiē xīn kǔ"], "tr": "农民伯伯顶着中午的太阳锄地，汗水一滴滴落进泥土；碗里每一粒米饭，都是这样辛苦种出来的。", "tag": "田园", "em": "🌾"}, {"t": "画", "a": "佚名", "slug": "hua", "lines": ["远看山有色，", "近听水无声。", "春去花还在，", "人来鸟不惊。"], "py": ["yuǎn kàn shān yǒu sè", "jìn tīng shuǐ wú shēng", "chūn qù huā hái zài", "rén lái niǎo bù jīng"], "tr": "远远看，山有颜色；走近听，水却没声音。春天走了，画上的花还开着；人走过来，画里的鸟也不飞。", "tag": "山水", "em": "⛰️"}, {"t": "江雪", "a": "柳宗元", "slug": "jiangxue", "lines": ["千山鸟飞绝，", "万径人踪灭。", "孤舟蓑笠翁，", "独钓寒江雪。"], "py": ["qiān shān niǎo fēi jué", "wàn jìng rén zōng miè", "gū zhōu suō lì wēng", "dú diào hán jiāng xuě"], "tr": "山上看不见一只鸟，小路上也没有人影；只有一位戴斗笠的老翁，独自在寒江雪里钓鱼。", "tag": "冬天", "em": "❄️"}, {"t": "登鹳雀楼", "a": "王之涣", "slug": "guanque", "lines": ["白日依山尽，", "黄河入海流。", "欲穷千里目，", "更上一层楼。"], "py": ["bái rì yī shān jǐn", "huáng hé rù hǎi liú", "yù qióng qiān lǐ mù", "gèng shàng yī céng lóu"], "tr": "太阳靠着山落下去，黄河向着大海流；想看得更远，就再往楼上走一层吧。", "tag": "山水", "em": "⛰️"}, {"t": "相思", "a": "王维", "slug": "xiangsi", "lines": ["红豆生南国，", "春来发几枝。", "愿君多采撷，", "此物最相思。"], "py": ["hóng dòu shēng nán guó", "chūn lái fā jǐ zhī", "yuàn jūn duō cǎi xié", "cǐ wù zuì xiāng sī"], "tr": "红豆长在南方，春天来了又抽出新枝；希望你多摘一些，它最能代表想念。", "tag": "送别", "em": "👋"}, {"t": "寻隐者不遇", "a": "贾岛", "slug": "xunyin", "lines": ["松下问童子，", "言师采药去。", "只在此山中，", "云深不知处。"], "py": ["sōng xià wèn tóng zi", "yán shī cǎi yào qù", "zhǐ zài cǐ shān zhōng", "yún shēn bù zhī chù"], "tr": "我在松树下问小童子，他说师父采药去了；就在这座山里，可是云太深，不知道在哪儿。", "tag": "山水", "em": "⛰️"}, {"t": "池上", "a": "白居易", "slug": "chishang", "lines": ["小娃撑小艇，", "偷采白莲回。", "不解藏踪迹，", "浮萍一道开。"], "py": ["xiǎo wá chēng xiǎo tǐng", "tōu cǎi bái lián huí", "bù jiě cáng zōng jì", "fú píng yī dào kāi"], "tr": "小娃娃撑着小船，偷偷采了白莲花回来；他不懂得藏踪迹，浮萍被划开一道长长的水路。", "tag": "童趣", "em": "🪁"}];
const BASE = '';
let cur=null, idx=0, timer=null, playing=false, imgLoaded=0;

document.getElementById('cards').innerHTML = POEMS.map((p,i)=>`
  <a class="card" href="#${p.slug}" onclick="openPlay(${i});return false;">
    <img src="${p.slug}/1.jpg" alt="" loading="lazy">
    <div><b>${p.t}</b><small>${p.a} · ${p.tag}</small><i>${p.lines[0]}</i></div>
    <span class="ar">›</span>
  </a>`).join('');

function buildStage(p){
  const st=document.getElementById('stage');
  st.innerHTML = p.lines.map((_,i)=>`<div class="slide" id="sl${i}"><img src="${p.slug}/${i+1}.jpg" alt=""></div>`).join('');
}

function openPlay(i){
  cur=POEMS[i]; idx=0;
  document.getElementById('list').style.display='none';
  document.getElementById('player').classList.add('on');
  document.getElementById('ptitle').textContent=cur.t;
  document.getElementById('pauthor').textContent=cur.a+' · '+cur.tag;
  buildStage(cur);
  document.getElementById('dots').innerHTML = cur.lines.map((_,k)=>`<i id="d${k}"></i>`).join('');
  showLine(0);
  startPlay();
}
function showLine(k){
  idx=k;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on', i===k));
  document.getElementById('pline').textContent=cur.lines[k];
  document.getElementById('ppy').textContent=cur.py[k]||'';
  cur.lines.forEach((_,i)=>document.getElementById('d'+i).classList.toggle('on', i===k));
  document.getElementById('prev').disabled = k===0;
  document.getElementById('next').disabled = k===cur.lines.length-1;
  // 重新触发 Ken Burns
  const img=document.querySelector('#sl'+k+' img');
  if(img){ const src=img.src; img.src=src; }
}
function speakLine(k){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(cur.lines[k].replace(/[，。？！、；：]$/,''));
    u.lang='zh-CN'; u.rate=0.82;
    const vs=speechSynthesis.getVoices().filter(v=>/zh/i.test(v.lang));
    if(vs.length){ const pick=vs.find(v=>/婷婷|Tingting|美嘉|Xiaoxiao|Yaoyao/i.test(v.name))||vs[0]; u.voice=pick; }
    speechSynthesis.speak(u);
  }catch(e){}
}
function advance(){
  if(!playing||!cur) return;
  if(idx>=cur.lines.length-1){ playing=false; document.getElementById('toggle').textContent='重播'; return; }
  showLine(idx+1); speakLine(idx+1); schedule();
}
function schedule(){ clearTimeout(timer); timer=setTimeout(advance, 5200); }
function startPlay(){ playing=true; document.getElementById('toggle').textContent='暂停'; speakLine(idx); schedule(); }
function togglePlay(){
  if(!playing){
    if(idx>=cur.lines.length-1){ showLine(0); startPlay(); return; }
    startPlay();
  }else{ playing=false; clearTimeout(timer); speechSynthesis.cancel(); document.getElementById('toggle').textContent='继续'; }
}
function nextLine(){ if(idx<cur.lines.length-1){ showLine(idx+1); if(playing){speakLine(idx); schedule();} } }
function prevLine(){ if(idx>0){ showLine(idx-1); if(playing){speakLine(idx); schedule();} } }
function stopPlay(){
  playing=false; clearTimeout(timer); speechSynthesis.cancel();
  document.getElementById('player').classList.remove('on');
  document.getElementById('list').style.display='';
  if(location.hash) history.replaceState(null,'',location.pathname);
}
window.addEventListener('hashchange',()=>{ const s=location.hash.slice(1); if(!s) stopPlay(); });
if(location.hash){ const s=location.hash.slice(1); const i=POEMS.findIndex(p=>p.slug===s); if(i>=0) openPlay(i); }
</script></body></html>
