<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>静夜思 · 动态诗画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d1512;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
  .scene.on{opacity:1}
  .scene img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 6s linear}
  .scene.on img{transform:scale(1.14) translateY(-1.5%)}
  .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,.1) 55%,rgba(0,0,0,.72) 100%)}
  .head{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;opacity:.92;z-index:3}
  .head b{font-size:20px;letter-spacing:4px;font-family:"Kaiti SC",STKaiti,serif;font-weight:600}
  .head span{display:block;font-size:12.5px;opacity:.72;margin-top:4px;letter-spacing:1px}
  .cap{position:absolute;left:0;right:0;bottom:132px;text-align:center;padding:0 26px;z-index:3}
  .cap .l{color:#fff;font-size:31px;letter-spacing:5px;font-family:"Kaiti SC",STKaiti,serif;text-shadow:0 2px 14px rgba(0,0,0,.55);transition:opacity .4s}
  .cap .p{color:rgba(255,255,255,.78);font-size:13.5px;letter-spacing:1px;margin-top:7px}
  .dots{position:absolute;left:0;right:0;bottom:104px;display:flex;gap:7px;justify-content:center;z-index:3}
  .dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35);transition:.3s}
  .dots i.on{width:22px;background:#fff}
  .bar{position:absolute;left:22px;right:22px;bottom:max(34px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:3}
  .bar button{flex:1;height:46px;border:none;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:15px;backdrop-filter:blur(8px)}
  .bar button.main{background:#7ec98f;color:#12351f;font-weight:700;flex:1.4}
  .start{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 40%,#20352c,#0b1310);color:#fff;transition:opacity .5s}
  .start.hide{opacity:0;pointer-events:none}
  .start h1{font-family:"Kaiti SC",STKaiti,serif;font-size:34px;letter-spacing:8px}
  .start p{font-size:13.5px;color:#9db3a7;letter-spacing:1px}
  .start button{margin-top:10px;padding:14px 40px;border:none;border-radius:16px;background:#7ec98f;color:#12351f;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <div class="scene" data-i="0"><img src="jys1.jpg" alt=""><div class="veil"></div></div>
  <div class="scene" data-i="1"><img src="jys2.jpg" alt=""><div class="veil"></div></div>
  <div class="scene" data-i="2"><img src="jys3.jpg" alt=""><div class="veil"></div></div>
  <div class="scene" data-i="3"><img src="jys4.jpg" alt=""><div class="veil"></div></div>
  <div class="head"><b>静 夜 思</b><span>唐 · 李白</span></div>
  <div class="cap"><div class="l" id="line">床前明月光</div><div class="p" id="py">chuáng qián míng yuè guāng</div></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="bar">
    <button onclick="prev()">上一句</button>
    <button class="main" id="playBtn" onclick="toggle()">暂停</button>
    <button onclick="next()">下一句</button>
  </div>
  <div class="start" id="start">
    <h1>静夜思</h1>
    <p>跟着画面，一句一句听</p>
    <button onclick="begin()">▶ 开始</button>
  </div>
</div>
<script>
const LINES=[["床前明月光","chuáng qián míng yuè guāng"],["疑是地上霜","yí shì dì shàng shuāng"],["举头望明月","jǔ tóu wàng míng yuè"],["低头思故乡","dī tóu sī gù xiāng"]];
let i=0, timer=null, playing=false;
const scenes=[...document.querySelectorAll('.scene')], dots=[...document.querySelectorAll('.dots i')];
function paint(){
  scenes.forEach((s,k)=>s.classList.toggle('on',k===i));
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  document.getElementById('line').textContent=LINES[i][0];
  document.getElementById('py').textContent=LINES[i][1];
  document.getElementById('line').style.opacity=1;
}
function speak(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.85; const v=speechSynthesis.getVoices().find(x=>/zh[-_]?(CN|Hans)/i.test(x.lang)); if(v)u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function show(k, say){
  i=(k+4)%4; paint();
  if(say!==false) speak(LINES[i][0]);
  if(playing){ clearTimeout(timer); timer=setTimeout(()=>show(i+1), 5200); }
}
function toggle(){
  playing=!playing;
  document.getElementById('playBtn').textContent = playing?'暂停':'继续';
  if(playing){ show(i); } else { clearTimeout(timer); }
}
function next(){ show(i+1); }
function prev(){ show(i-1); }
function begin(){
  document.getElementById('start').classList.add('hide');
  playing=true; document.getElementById('playBtn').textContent='暂停';
  show(0);
  setTimeout(()=>speechSynthesis.getVoices(),100);
}
paint();
</script>
</body>
</html>
