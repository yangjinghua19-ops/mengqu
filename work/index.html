<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杨子倾萌趣乐园学习工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="萌趣乐园">
<meta name="theme-color" content="#f7fbf7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* ============ 设计变量 ============ */
:root{
  --green:#7ec98f; --green-d:#5eb073; --green-l:#e8f7ec;
  --pink:#ffb6c8; --pink-d:#ff8fab; --pink-l:#fff0f4;
  --yellow:#ffd97d; --blue:#9fd6f5; --purple:#c9b6f5; --orange:#ffbe8a;
  --ink:#4a4a55; --ink-l:#8b8b99; --line:#eef0f4; --bg:#f7fbf8; --white:#fff;
  --radius:22px; --radius-s:14px;
  --shadow:0 6px 18px rgba(120,160,140,.13);
  --shadow-s:0 3px 10px rgba(120,160,140,.10);
  --fs:17px; --fs-h1:26px; --fs-h2:21px; --fs-card:19px; --fs-btn:18px;
  --nav-w:190px; --tap:52px;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
}
/* 分龄字号：小班最大 */
body.mode-s{--fs:19px;--fs-h1:30px;--fs-h2:24px;--fs-card:22px;--fs-btn:20px;--tap:58px;--nav-w:200px}
body.mode-m{--fs:17px;--fs-h1:26px;--fs-h2:21px;--fs-card:19px;--fs-btn:18px;--tap:52px;--nav-w:190px}
body.mode-l{--fs:15.5px;--fs-h1:23px;--fs-h2:19px;--fs-card:17px;--fs-btn:16.5px;--tap:48px;--nav-w:180px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);font-size:var(--fs);color:var(--ink);
  background:var(--bg);line-height:1.6;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ============ 布局 ============ */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{
  width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--white);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:14px 10px;overflow-y:auto;transition:transform .25s;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand svg{width:40px;height:40px;flex:0 0 40px}
.brand b{font-size:13.5px;line-height:1.3;display:block;letter-spacing:0;white-space:nowrap}
.brand span{font-size:11px;color:var(--ink-l);display:block;font-weight:400}
.nav-group{margin-bottom:6px}
.nav-title{font-size:11.5px;color:var(--ink-l);padding:10px 12px 4px;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:14px;
  font-size:14.5px;color:var(--ink);margin-bottom:2px;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-item .ic{font-size:18px;width:22px;text-align:center;flex:0 0 22px}
.nav-item:hover{background:var(--green-l)}
.nav-item.on{background:var(--green);color:#fff;font-weight:600;box-shadow:var(--shadow-s)}
.nav-item .badge{margin-left:auto;background:var(--pink);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px}
.nav-item.on .badge{background:rgba(255,255,255,.3)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:12px;
  padding:0 18px;background:var(--white);border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.02);z-index:5;
}
.hamburger{display:none;font-size:22px;padding:6px}
.tb-pet{display:flex;align-items:center;gap:8px;background:var(--pink-l);border-radius:14px;padding:4px 12px 4px 6px;flex:0 0 auto;cursor:pointer}
.tb-pet small{white-space:nowrap}
.tb-pet svg{width:34px;height:34px}
.tb-pet b{font-size:13px}
.tb-pet small{display:block;font-size:10.5px;color:var(--ink-l);line-height:1.1}
.tb-date{font-size:13px;color:var(--ink-l)}
.tb-streak{display:flex;align-items:center;gap:4px;background:#fff6e6;color:#c98a1a;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:600}
.spacer{flex:1}
.tb-voice{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:16px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.tb-voice:active{transform:scale(.94)}
.voice-modal{max-width:380px;text-align:left}
.voice-modal h3,.voice-modal .m-art{text-align:center}
.v-row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px;color:var(--ink)}
.v-row>span{flex:0 0 42px;color:var(--ink-l)}
.v-row select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff}
.v-row input[type=range]{flex:1;accent-color:var(--green)}
.v-row b{flex:0 0 46px;text-align:right;font-size:13px;color:var(--green-d)}
.v-tip{font-size:12px;line-height:1.6;color:var(--ink-l);background:var(--green-l);border-radius:10px;padding:9px 11px;margin:12px 0 4px}
.mode-switch{display:flex;background:var(--green-l);border-radius:14px;padding:3px;gap:2px;flex:0 0 auto}
.mode-switch button{padding:6px 11px;border-radius:11px;font-size:13px;color:var(--green-d);font-weight:600;min-height:34px;white-space:nowrap;flex:0 0 auto}
.mode-switch button.on{background:var(--green);color:#fff;box-shadow:var(--shadow-s)}
.content{flex:1;overflow-y:auto;padding:20px 22px 40px;scroll-behavior:smooth}
.view{max-width:1080px;margin:0 auto;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:var(--fs-h1);letter-spacing:.5px}
.page-head .sub{color:var(--ink-l);font-size:13.5px;padding-bottom:4px}
.card{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.tight{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

/* ---- 闯关地图 ---- */
.sec-title{font-size:14px;color:var(--ink-l);font-weight:700;margin:16px 4px 8px}
.note{font-size:13.5px;color:var(--ink-l);line-height:1.7;padding:6px}
.gk-hero{background:linear-gradient(160deg,#eaf9ee 0%,#f4fbf6 60%,#fff5f8 100%);border-radius:26px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid #e4f2e8;margin-bottom:16px}
.gk-hero h2{margin:0 0 6px;font-size:var(--fs-h1)}
.gk-hero p{margin:0;color:var(--ink-l);font-size:14.5px;line-height:1.6}
.gk-hero .gk-bar{margin-top:12px}
.gk-unit{display:flex;align-items:center;gap:13px;background:var(--white);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:.15s}
.gk-unit:active{transform:scale(.99)}
.gk-unit.locked{opacity:.5;cursor:default}
.gk-badge{width:44px;height:44px;border-radius:14px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
.gk-info{flex:1;min-width:0}
.gk-info b{font-size:20px;letter-spacing:2px;color:var(--ink);display:block;line-height:1.35}
.gk-info small{font-size:12.5px;color:var(--ink-l)}
.gk-go{font-size:13px;color:var(--green-d);font-weight:700;flex:0 0 auto}
.gk-bar{height:8px;background:#eef4f0;border-radius:8px;overflow:hidden;margin-top:7px}
.gk-bar i{display:block;height:100%;background:var(--green);border-radius:8px}
.gk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px}
@media(max-width:520px){.gk-grid{grid-template-columns:repeat(4,1fr)}}
.gk-cell{background:var(--white);border-radius:16px;padding:10px 4px 8px;text-align:center;box-shadow:var(--shadow-s);position:relative;cursor:pointer}
.gk-cell:active{transform:scale(.97)}
.gk-cell.done{background:var(--green-l)}
.gk-zi{font-size:32px;font-weight:700;color:var(--ink);line-height:1.2}
.gk-py{font-size:12px;color:var(--ink-l)}
.gk-star{position:absolute;top:3px;right:6px;font-size:12px}
.gk-trace-wrap{display:flex;justify-content:center;margin:4px 0 10px}
.gk-svg{width:min(80vw,330px);height:min(80vw,330px);background:var(--white);border-radius:22px;box-shadow:var(--shadow);touch-action:none;display:block}
.gk-hint{text-align:center;color:var(--ink-l);font-size:14.5px;margin-bottom:12px;min-height:20px}
.gk-actions{display:flex;gap:10px;justify-content:center}
@media(max-width:520px){.g2{grid-template-columns:1fr}.g3,.g4{grid-template-columns:repeat(2,1fr)}
  .stat-tile{padding:11px 8px}.stat-tile b{font-size:20px}.stat-tile span{font-size:11.5px}
  .mode-switch button{padding:5px 8px;font-size:12px;min-height:30px}
  .tb-streak{font-size:11.5px;padding:3px 7px}
  .content{padding:12px 12px 50px}
  .learn-card{padding:18px 14px}
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 22px;border-radius:16px;font-size:var(--fs-btn);
  font-weight:600;background:var(--green);color:#fff;box-shadow:var(--shadow-s);
  transition:transform .12s,box-shadow .12s,filter .12s;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--green-l);color:var(--green-d);box-shadow:none}
.btn.pink{background:var(--pink)}
.btn.pk{background:var(--pink-l);color:#d4587a;box-shadow:none}
.btn.yellow{background:var(--yellow);color:#8a6410}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--green-l);color:var(--green-d);border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600}
.pill.pink{background:var(--pink-l);color:#d4587a}
.pill.yellow{background:#fff6e6;color:#c98a1a}
.pill.blue{background:#eaf6fd;color:#3d8fbf}
.muted{color:var(--ink-l);font-size:13.5px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{padding:36px 16px;text-align:center;color:var(--ink-l)}
.empty .big{font-size:46px;display:block;margin-bottom:8px}

/* 进度条 */
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#a8e0b4);border-radius:9px;transition:width .5s cubic-bezier(.4,1.4,.5,1)}

/* 学习卡片 */
.learn-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.learn-card .art{font-size:76px;line-height:1;margin:6px 0 12px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.06))}
.learn-card .big-char{font-size:86px;font-weight:700;letter-spacing:4px;line-height:1.15;color:#3f4a44;font-family:"Kaiti SC","STKaiti",var(--font)}
.learn-card .pinyin{font-size:22px;color:var(--green-d);letter-spacing:2px;margin-top:2px;font-weight:600}
.learn-card .word{font-size:var(--fs-card);color:var(--ink-l);margin-top:6px}
.learn-card .pinyin-line{font-size:14px;color:#b0b0bd;letter-spacing:1px}

/* 选项 */
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.options.one{grid-template-columns:1fr}
@media(max-width:520px){.options{grid-template-columns:1fr}}
.opt{
  min-height:76px;border-radius:18px;background:var(--white);border:2.5px solid var(--line);
  font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;
  gap:8px;padding:10px 14px;transition:transform .12s,border-color .15s,background .15s;
  box-shadow:var(--shadow-s);
}
.opt:hover{border-color:var(--green);transform:translateY(-2px)}
.opt.correct{border-color:var(--green);background:var(--green-l);animation:pop .45s}
.opt.wrong{border-color:#ff9aa8;background:#fff2f4;animation:shake .4s}
.opt.dim{opacity:.55}
@media(max-width:520px){.opt{font-size:22px;min-height:66px}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 题目头 */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.q-prompt{font-size:var(--fs-card);font-weight:600;color:#3f4a44}
.q-visual{font-size:40px;letter-spacing:4px;margin:8px 0;line-height:1.3}

/* 宠物 */
.pet-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:150px}
.pet-stage svg{width:130px;height:130px;transition:transform .3s}
.pet-stage.happy svg{animation:hop .6s ease 2}
.pet-stage.sad svg{animation:tilt .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(-6px) rotate(2deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.flying-food{position:fixed;font-size:34px;z-index:99;pointer-events:none;transition:all .85s cubic-bezier(.4,0,.6,1)}

/* 首页花园 */
.hero{
  background:linear-gradient(160deg,#eaf9ee 0%,#f4fbf6 60%,#fff5f8 100%);
  border-radius:26px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  border:1px solid #e4f2e8;
}
.hero h2{font-size:var(--fs-h2)}
.hero .greet{color:#6f8a78;font-size:14px;margin-top:4px}
.hero-pet{position:absolute;right:18px;bottom:8px;opacity:.96}
.hero-pet svg{width:120px;height:120px}
@media(max-width:640px){.hero-pet{display:none}}
.stat-tile{background:var(--white);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow-s)}
.stat-tile b{display:block;font-size:24px;color:var(--green-d);line-height:1.2}
.stat-tile span{font-size:12.5px;color:var(--ink-l)}

/* 花园格子 */
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:12px}
.plot{
  aspect-ratio:1;border-radius:16px;background:linear-gradient(#f6ecd8,#efe0c4);
  display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;
  border:2px dashed #e3d3b4;transition:transform .12s,background .2s;
}
.plot:hover{transform:translateY(-2px);background:linear-gradient(#faf1e2,#f3e6cd)}
.plot.full{border-style:solid;border-color:#e0cba4;background:linear-gradient(#f3f8e8,#e8f2d8)}
.plot .snail{position:absolute;font-size:20px;transform:translate(22px,20px);opacity:.9}

/* 打卡日历 */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-cell{aspect-ratio:1;border-radius:11px;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#a8adb8;position:relative}
.cal-cell.done{background:var(--green);color:#fff;font-weight:700}
.cal-cell.today{outline:2.5px solid var(--pink-d);outline-offset:1px}
.cal-head{font-size:11px;color:var(--ink-l);text-align:center}

/* 列表项 */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .em{font-size:24px;flex:0 0 30px;text-align:center}
.list-item .tx{flex:1;min-width:0}
.list-item .tx b{display:block;font-size:15px;font-weight:600}
.list-item .tx small{color:var(--ink-l);font-size:12.5px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(60,70,66,.34);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:26px;padding:26px 24px;max-width:430px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop2 .3s}
@keyframes pop2{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal .m-art{font-size:52px;margin-bottom:6px}
.modal h3{font-size:var(--fs-h2);margin-bottom:6px}
.modal p{color:var(--ink-l);font-size:14.5px;margin-bottom:18px}
.modal .m-btns{display:flex;gap:10px}
.modal .m-btns .btn{flex:1}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:rgba(58,68,63,.94);color:#fff;padding:11px 20px;border-radius:14px;font-size:14.5px;
  z-index:80;opacity:0;transition:all .3s;pointer-events:none;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 语音按钮 */
.speak-btn{
  display:inline-flex;align-items:center;gap:5px;background:#eef7ff;color:#3d8fbf;
  border-radius:14px;padding:7px 13px;font-size:13.5px;font-weight:600;min-height:38px;
}
.speak-btn:hover{background:#e2f1ff}

/* 奖励卡 */
.reward-card{background:var(--white);border-radius:18px;padding:16px;text-align:center;box-shadow:var(--shadow-s);border:1.5px solid var(--line)}
.reward-card .em{font-size:38px}
.reward-card b{display:block;font-size:14.5px;margin:6px 0 2px}
.reward-card small{color:var(--ink-l);font-size:12px}

/* 游戏区 */
.game-board{position:relative;background:#fbfdfb;border:2px dashed #dceadf;border-radius:20px;padding:16px;min-height:260px}
.tile{background:var(--white);border-radius:14px;box-shadow:var(--shadow-s);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .15s;min-height:70px}
.tile:hover{transform:translateY(-2px)}
.tile.sel{outline:3px solid var(--pink-d);outline-offset:-1px}
.tile.matched{opacity:.35;pointer-events:none;transform:scale(.96)}
.puzzle{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.puzzle .pp{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff;box-shadow:var(--shadow-s);cursor:pointer}

/* 移动端 */
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.14)}
  .sidebar.open{transform:none}
  .hamburger{display:block}
  .content{padding:14px 14px 60px}
  .topbar{padding:0 12px;gap:8px;height:56px;flex:0 0 56px}
  .tb-date{display:none}
  .brand span{display:none}
  .learn-card .big-char{font-size:66px}
  .hero-pet{display:none}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;display:none}
.scrim.on{display:block}
.hide{display:none!important}

.gk-box{width:150px;height:150px;margin:4px auto 8px;border:1.5px dashed #bfe2ca;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:86px;line-height:1;color:#4f9f6a}

<script>
/* =====================================================================
   杨子倾萌趣乐园学习工作台  ·  单文件离线应用
   数据键：mengqu_study_v1_<mode>   三档独立存储
   ===================================================================== */
'use strict';

const APP = 'mengqu_study_v1';
const MODE_NAME = { s:'小班', m:'中班', l:'大班' };
const MODE_AGE  = { s:'3-4岁', m:'4-5岁', l:'5-6岁' };
const SPEECH_RATE = { s:0.72, m:0.88, l:1.0 };
const PET_STAGES = ['兔宝宝','小兔','大兔','魔法兔'];
/* 每档解锁的成长阶段数 */
const STAGE_UNLOCK = { s:2, m:3, l:4 };
const XP_NEED = [30, 80, 160];      // 升到下一阶段所需经验

/* ---------------- 工具 ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const yesterdayKey = () => { const d=new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const rnd = (n)=>Math.floor(Math.random()*n);
const pick = (a)=>a[rnd(a.length)];
const shuffle = (a)=>{ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];} return b; };
const sample = (a,n)=>shuffle(a).slice(0,n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,ms=1800){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }

/* ---------------- 声音 ---------------- */
let AC=null;
function beep(freqs,type='sine',dur=.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      const t0=AC.currentTime+i*dur*0.9;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(.16,t0+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.02);
    });
  }catch(e){}
}
const sfx = {
  ok(){ beep([660,880,1180],'sine',.11); },
  no(){ beep([320,240],'sine',.16); },
  pop(){ beep([880],'triangle',.07); },
  win(){ beep([660,880,1100,1320],'sine',.13); }
};

/* ---------------- 语音 ---------------- */
const VOICE_KEY='mengqu_voice_v1';
let VS = {name:'', rate:0};
try{ VS = Object.assign(VS, JSON.parse(localStorage.getItem(VOICE_KEY)||'{}')); }catch(e){}
function saveVS(){ try{ localStorage.setItem(VOICE_KEY, JSON.stringify(VS)); }catch(e){} }

let voiceCache=[];
function loadVoices(){
  try{ voiceCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ voiceCache=[]; }
  return voiceCache;
}
if(window.speechSynthesis){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} }
function zhVoiceList(){ return loadVoices().filter(v=>/^zh/i.test(v.lang||'')); }

/* 挑一个「像中国人说话」的声音：优先 zh-CN，其次按常见中文音色名 */
function pickVoice(lang){
  lang = lang || 'zh-CN';
  const all = loadVoices();
  if(!all.length) return null;
  if(/^en/i.test(lang)){
    const en = all.filter(v=>/^en/i.test(v.lang));
    if(!en.length) return null;
    if(VS.enName){ const hit=en.find(v=>v.name===VS.enName); if(hit) return hit; }
    const us = en.filter(v=>/en[-_]US/i.test(v.lang));
    const pool2 = us.length ? us : en;
    const pref2 = /Samantha|Ava|Allison|Google US English|Aria|Jenny|Guy|Zira|Mark/i;
    return pool2.find(v=>pref2.test(v.name)) || pool2[0];
  }
  const zh = all.filter(v=>/^zh/i.test(v.lang));
  if(!zh.length) return null;
  if(VS.name){ const hit=zh.find(v=>v.name===VS.name); if(hit) return hit; }
  const cn = zh.filter(v=>/zh[-_]?(CN|Hans)/i.test(v.lang));
  const pool = cn.length ? cn : zh;
  const pref = /婷婷|Tingting|Ting-Ting|美嘉|Meijia|语舒|Yu[- ]?shu|Lili|Li[- ]?mu/i;
  return pool.find(v=>pref.test(v.name)) || pool[0];
}
function curRate(){ return VS.rate>0 ? +VS.rate : (SPEECH_RATE[S.mode]||.9); }

let hintedVoice=false;
function hintNoZhVoice(){
  if(hintedVoice) return; hintedVoice=true;
  toast('没找到中文语音：设置→辅助功能→朗读内容→声音→中文，下载一个再回来', 4500);
}
function splitLang(text){
  const out=[]; const re=/[A-Za-z][A-Za-z'’\-]*/g; let last=0, m;
  while((m=re.exec(text))){
    if(m.index>last) out.push({t:text.slice(last,m.index), lang:'zh-CN'});
    out.push({t:m[0], lang:'en-US'});
    last=m.index+m[0].length;
  }
  if(last<text.length) out.push({t:text.slice(last), lang:'zh-CN'});
  return out.filter(x=>x.t.trim());
}
function speak(text, lang){
  if(!window.speechSynthesis){ toast('这个浏览器不支持语音朗读'); return; }
  if(!lang){
    if(/[\u4e00-\u9fa5]/.test(text) && /[A-Za-z]/.test(text)){
      const segs = splitLang(text);
      segs.forEach((sg,i)=> setTimeout(()=>speak(sg.t, sg.lang), i*260));
      return;
    }
    lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-CN' : 'en-US';
  }
  try{
    /* iOS 两个坑：cancel() 之后立刻 speak() 会被吞；但首次播放又必须在用户手势里同步调用。
       所以只有「确实打断了正在播的内容」时才延迟，其余情况立即播。 */
    const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
    speechSynthesis.cancel();
    const fire = ()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang = /^en/i.test(lang) ? 'en-US' : 'zh-CN';
        u.rate = curRate();
        u.pitch = 1.02;
        const v = pickVoice(lang);
        if(v) u.voice = v; else if(!/^en/i.test(lang)) hintNoZhVoice();
        speechSynthesis.speak(u);
      }catch(e){}
    };
    if(wasBusy) setTimeout(fire, 60); else fire();
  }catch(e){}
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

function openVoiceSettings(){
  const zh = zhVoiceList();
  const opts = zh.length
    ? zh.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${VS.name===v.name?'selected':''}>${v.name}（${v.lang}）${v.localService?'· 本机':'· 在线'}</option>`).join('')
    : `<option value="">没有检测到中文语音</option>`;
  const ens = loadVoices().filter(v=>/^en/i.test(v.lang||''));
  const enOpts = `<option value="" ${!VS.enName?'selected':''}>自动（推荐美音）</option>` +
    ens.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${VS.enName===v.name?'selected':''}>${v.name}（${v.lang}）</option>`).join('');
  $('#modalRoot').innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()">
    <div class="modal voice-modal">
      <div class="m-art">🔊</div>
      <h3>语音设置</h3>
      <p>${zh.length ? '选一个听着自然的中文声音试试' : '⚠️ 这台设备还没装中文语音'}</p>
      <label class="v-row"><span>中文音色</span><select id="vSel" onchange="VS.name=this.value;saveVS();">${opts}</select></label>
      <label class="v-row"><span>英文音色</span><select id="veSel" onchange="VS.enName=this.value;saveVS();">${enOpts}</select></label>
      <label class="v-row"><span>语速</span><input id="vRate" type="range" min="0.6" max="1.2" step="0.02" value="${curRate()}" oninput="VS.rate=+this.value;saveVS();document.getElementById('vRateVal').textContent=(+this.value).toFixed(2)+'x'"><b id="vRateVal">${curRate().toFixed(2)}x</b></label>
      <div class="v-tip">iPad / iPhone 装中文语音：<b>设置 → 辅助功能 → 朗读内容 → 声音 → 中文（中国大陆）</b>，下载「婷婷」。装完回到这里，音色列表会自动出现。</div>
      <div class="m-btns">
        <button class="btn ghost" onclick="speak('你好呀，我们读读 apple')">试听中英</button>
        <button class="btn" onclick="closeModal()">好了</button>
      </div>
    </div></div>`;
}

/* ---------------- 状态 ---------------- */
let S = null;           // 当前档位的状态
let MODE = 'm';

function blankState(mode){
  return {
    mode, name:'', petName:'朵朵',
    bones:0, xp:0, stage:0,
    food:{ carrot:0, strawberry:0, dew:0 },
    checkins:[], streak:0, lastStudy:'',
    learnedChars:[], learnedPoems:[], wrong:[], rewards:[], planted:[],
    gamesCleared:0, levelsCleared:0,
    stats:{ done:0, right:0, streakRight:0, todayDone:0, todayRight:0, todayGames:0, todayBones:0, minutes:0 },
    tasksDone:{}, daily:{ date:'', pools:{} }, star:0, seen:{}
  };
}
function loadMode(mode){
  try{
    const raw = localStorage.getItem(APP+'_'+mode);
    if(!raw) return blankState(mode);
    const st = Object.assign(blankState(mode), JSON.parse(raw));
    st.stats = Object.assign(blankState(mode).stats, st.stats||{});
    st.food  = Object.assign({carrot:0,strawberry:0,dew:0}, st.food||{});
    st.daily = st.daily || {date:'',pools:{}};
    return st;
  }catch(e){ return blankState(mode); }
}
function save(){
  try{ localStorage.setItem(APP+'_'+MODE, JSON.stringify(S)); }catch(e){ console.warn('save failed',e); }
}
function switchMode(mode){
  if(mode===MODE && S) return;
  stopSpeak();
  MODE = mode; S = loadMode(mode);
  const gname = localStorage.getItem(APP+'_name');
  if(gname) S.name = gname;
  document.body.className = 'mode-'+mode;
  $$('#modeSwitch button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
  ensureDaily();
  renderChrome();
  go(currentView||'home');
  save();
}

/* 每日打卡任务：按周轮换（池子 20 条） */
function dailyTasks(){
  const all = TASKS[MODE] || [];
  if(!all.length) return [];
  const n = MODE==='l' ? 5 : 4;
  const wk = Math.floor(Date.now()/6048e5);
  const start = (wk*3) % all.length;
  return Array.from({length:Math.min(n,all.length)},(_,i)=>all[(start+i)%all.length]);
}


/* 各档笔画区间：小班 16 关 / 中班 43 关 / 大班 39 关 */
const GK_BANDS = { s:[1,5], m:[6,9], l:[10,99] };


/* ---------------- 本周计划条 ---------------- */
function weekDays(){
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-dow); mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function weekStrip(tasks, doneFn){
  const days=weekDays(), names=['一','二','三','四','五','六','日'];
  const today=new Date(); today.setHours(0,0,0,0);
  return `<div class="wk-strip">${days.map((d,i)=>{
    const isToday = d.getTime()===today.getTime();
    const done = doneFn ? doneFn(i,d) : false;
    const idle = !tasks[i];
    return `<div class="wk-day${isToday?' today':''}${done?' done':''}${idle?' idle':''}">
      <b>周${names[i]}</b><span>${d.getMonth()+1}/${d.getDate()}</span>
      <i>${done?'✓':(tasks[i]||'·')}</i></div>`;
  }).join('')}</div>`;
}
/* ---------------- 今日目标 ---------------- */
const GOAL_CHARS = 3, GOAL_MATH = 3;
function goalCharsN(){ return MODE==='s' ? 1 : 2; }
function goalState(){
  const k = todayKey();
  if(!S.goal || S.goal.d !== k) S.goal = { d:k, chars:0, math:0, bonus:false };
  return S.goal;
}
function goalAdd(kind, n=1){
  const g = goalState();
  g[kind] = (g[kind]||0) + n;
  if(g.chars>=goalCharsN() && g.math>=GOAL_MATH && !g.bonus){
    g.bonus = true;
    S.bones += 5;
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.goalStreak = (S.goalLast===y) ? (S.goalStreak||1)+1 : 1;
    S.goalLast = g.d;
    burst('🦴');

function ensureDaily(){
  const t = todayKey();
  if(S.daily.date !== t){
    S.daily = { date:t, pools:{} };
    S.stats.todayDone=0; S.stats.todayRight=0; S.stats.todayGames=0; S.stats.todayBones=0;
    save();
    prebuildPools();
  }
}
/* 换日时立刻生成本日全部题池（不是清空后懒加载） */
function prebuildPools(){
  ['shizi','pinyin','suan','yingyu','luoji','kepu'].forEach(v=>{
    try{
      const fn = VIEWS[v];
      if(typeof fn === 'function'){ const box=document.createElement('div'); box.innerHTML = fn() || ''; }
    }catch(e){ console.warn('prebuild '+v+' failed', e && e.message); }
  });
  save();
}
function pool(key, build){
  if(!S.daily.pools[key]){ S.daily.pools[key] = build(); save(); }
  return S.daily.pools[key];
}

const FOOD_META = {
  carrot:{ em:'🥕', name:'胡萝卜', xp:5 },
  strawberry:{ em:'🍓', name:'草莓', xp:8 },
  dew:{ em:'💧', name:'露水', xp:6 }
};
function grant(food, opts={}){
  S.food[food] = (S.food[food]||0) + 1;
  S.bones += 1;
  S.stats.todayBones += 1;
  addXp(FOOD_META[food].xp);
  save();
  flyFood(FOOD_META[food].em);
  if(!opts.silent) toast(`${FOOD_META[food].em} 得到${FOOD_META[food].name} +${FOOD_META[food].xp} 经验`);
}
function addXp(n){
  const maxStage = STAGE_UNLOCK[MODE]-1;
  S.xp += n;
  while(S.stage < maxStage){
    const need = XP_NEED[S.stage];
    if(S.xp >= need){ S.xp -= need; S.stage++; celebrateStage(); }
    else break;
  }
  if(S.stage >= maxStage){ S.xp = Math.min(S.xp, XP_NEED[maxStage-1]||999); }
}
function celebrateStage(){
  sfx.win();
  burst('✨');
  toast(`🎉 朵朵长大啦！现在是「${PET_STAGES[S.stage]}」`,2600);
}
function flyFood(em){
  const pet = $('#tbPet'); if(!pet) return;
  const r = pet.getBoundingClientRect();
  const el = document.createElement('div');
  el.className='flying-food'; el.textContent=em;
  el.style.left = (window.innerWidth/2-18)+'px';
  el.style.top  = (window.innerHeight-120)+'px';
  document.body.appendChild(el);
  requestAnimationFrame(()=>{
    el.style.left = (r.left+r.width/2-18)+'px';
    el.style.top  = (r.top+8)+'px';
    el.style.transform='scale(.45) rotate(25deg)';
    el.style.opacity='.2';
  });
  setTimeout(()=>{ el.remove(); const st=$('#tbPet'); if(st){ st.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:420}); } },900);
}
function burst(ch){
  for(let i=0;i<10;i++){
    const el=document.createElement('div');
    el.className='flying-food'; el.textContent=ch;
    el.style.left=(window.innerWidth/2)+'px';
    el.style.top=(window.innerHeight/2)+'px';
    el.style.fontSize=(16+rnd(16))+'px';
    document.body.appendChild(el);
    const dx=(Math.random()-.5)*320, dy=-80-Math.random()*220;
    requestAnimationFrame(()=>{ el.style.transform=`translate(${dx}px,${dy}px) scale(.4)`; el.style.opacity='0'; });
    setTimeout(()=>el.remove(),900);
  }
}

/* ---------------- 算术 ---------------- */
function numOpts(ans, spread=3, count=4){
  const set=new Set([ans]);
  while(set.size<count){ const d=rnd(spread*2+1)-spread; const v=ans+d; if(v>=0) set.add(v); }
  return shuffle([...set]);
}
function numericQ(ans, spread, type, prompt, visual){
  const opts = numOpts(ans, spread, 4);
  return { type, prompt, visual:visual||'', options:opts, ans:opts.indexOf(ans) };
}

const POEMS = {"s":[{"t":"咏鹅","a":"骆宾王","lines":["鹅，鹅，鹅，","曲项向天歌。","白毛浮绿水，","红掌拨清波。"],"py":["é é é","qū xiàng xiàng tiān gē","bái máo fú lǜ shuǐ","hóng zhǎng bō qīng bō"],"tr":"大白鹅弯着脖子，朝着天空大声唱歌；白羽毛漂在绿水上，红脚掌划开清清的水波。","tag":"动物","em":"🦢"},{"t":"静夜思","a":"李白","lines":["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],"py":["chuáng qián míng yuè guāng","yí shì dì shàng shuāng","jǔ tóu wàng míng yuè","dī tóu sī gù xiāng"],"tr":"床前的月光白白的，像地上铺了一层霜；我抬头看看月亮，低下头就想起了老家。","tag":"月亮","em":"🌙"},{"t":"春晓","a":"孟浩然","lines":["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],"py":["chūn mián bù jué xiǎo","chù chù wén tí niǎo","yè lái fēng yǔ shēng","huā luò zhī duō shǎo"],"tr":"春天睡得真香，天亮了都不知道；醒来听见处处鸟叫，想起夜里的风雨，不知打落了多少花。","tag":"春天","em":"🌸"},{"t":"悯农","a":"李绅","lines":["锄禾日当午，","汗滴禾下土。","谁知盘中餐，","粒粒皆辛苦。"],"py":["chú hé rì dāng wǔ","hàn dī hé xià tǔ","shuí zhī pán zhōng cān","lì lì jiē xīn kǔ"],"tr":"农民伯伯顶着中午的太阳锄地，汗水一滴滴落进泥土；碗里每一粒米饭，都是这样辛苦种出来的。","tag":"田园","em":"🌾"},{"t":"画","a":"佚名","lines":["远看山有色，","近听水无声。","春去花还在，","人来鸟不惊。"],"py":["yuǎn kàn shān yǒu sè","jìn tīng shuǐ wú shēng","chūn qù huā hái zài","rén lái niǎo bù jīng"],"tr":"远远看，山有颜色；走近听，水却没声音。春天走了，画上的花还开着；人走过来，画里的鸟也不飞。","tag":"山水","em":"⛰️"},{"t":"江雪","a":"柳宗元","lines":["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],"py":["qiān shān niǎo fēi jué","wàn jìng rén zōng miè","gū zhōu suō lì wēng","dú diào hán jiāng xuě"],"tr":"山上看不见一只鸟，小路上也没有人影；只有一位戴斗笠的老翁，独自在寒江雪里钓鱼。","tag":"冬天","em":"❄️"},{"t":"登鹳雀楼","a":"王之涣","lines":["白日依山尽，","黄河入海流。","欲穷千里目，","更上一层楼。"],"py":["bái rì yī shān jǐn","huáng hé rù hǎi liú","yù qióng qiān lǐ mù","gèng shàng yī céng lóu"],"tr":"太阳靠着山落下去，黄河向着大海流；想看得更远，就再往楼上走一层吧。","tag":"山水","em":"⛰️"},{"t":"相思","a":"王维","lines":["红豆生南国，","春来发几枝。","愿君多采撷，","此物最相思。"],"py":["hóng dòu shēng nán guó","chūn lái fā jǐ zhī","yuàn jūn duō cǎi xié","cǐ wù zuì xiāng sī"],"tr":"红豆长在南方，春天来了又抽出新枝；希望你多摘一些，它最能代表想念。","tag":"送别","em":"👋"},{"t":"寻隐者不遇","a":"贾岛","lines":["松下问童子，","言师采药去。","只在此山中，","云深不知处。"],"py":["sōng xià wèn tóng zi","yán shī cǎi yào qù","zhǐ zài cǐ shān zhōng","yún shēn bù zhī chù"],"tr":"我在松树下问小童子，他说师父采药去了；就在这座山里，可是云太深，不知道在哪儿。","tag":"山水","em":"⛰️"},{"t":"池上","a":"白居易","lines":["小娃撑小艇，","偷采白莲回。","不解藏踪迹，","浮萍一道开。"],"py":["xiǎo wá chēng xiǎo tǐng","tōu cǎi bái lián huí","bù jiě cáng zōng jì","fú píng yī dào kāi"],"tr":"小娃娃撑着小船，偷偷采了白莲花回来；他不懂得藏踪迹，浮萍被划开一道长长的水路。","tag":"童趣","em":"🪁"}],"m":[{"t":"望庐山瀑布","a":"李白","lines":["日照香炉生紫烟，","遥看瀑布挂前川。","飞流直下三千尺，","疑是银河落九天。"],"py":["rì zhào xiāng lú shēng zǐ yān","yáo kàn pù bù guà qián chuān","fēi liú zhí xià sān qiān chǐ","yí shì yín hé luò jiǔ tiān"],"tr":"太阳照着香炉峰，升起紫烟，瀑布像白布挂在山前；水直冲下来好像三千尺长，真让人怀疑是银河从天上落下。","tag":"山水","em":"⛰️"},{"t":"赠汪伦","a":"李白","lines":["李白乘舟将欲行，","忽闻岸上踏歌声。","桃花潭水深千尺，","不及汪伦送我情。"],"py":["lǐ bái chéng zhōu jiāng yù xíng","hū wén àn shàng tà gē shēng","táo huā tán shuǐ shēn qiān chǐ","bù jí wāng lún sòng wǒ qíng"],"tr":"我坐上船正要走，忽然听见岸上有人踏着节拍唱歌送我；桃花潭水再深，也比不上汪伦这份情谊深。","tag":"送别","em":"👋"},{"t":"绝句","a":"杜甫","lines":["两个黄鹂鸣翠柳，","一行白鹭上青天。","窗含西岭千秋雪，","门泊东吴万里船。"],"py":["liǎng gè huáng lí míng cuì liǔ","yī xíng bái lù shàng qīng tiān","chuāng hán xī lǐng qiān qiū xuě","mén pō dōng wú wàn lǐ chuán"],"tr":"两只黄鹂在翠柳上唱歌，一行白鹭飞上蓝天；窗里框着西岭的千年雪，门前停着东吴来的船。","tag":"春天","em":"🌸"},{"t":"村居","a":"高鼎","lines":["草长莺飞二月天，","拂堤杨柳醉春烟。","儿童散学归来早，","忙趁东风放纸鸢。"],"py":["cǎo zhǎng yīng fēi èr yuè tiān","fú dī yáng liǔ zuì chūn yān","ér tóng sàn xué guī lái zǎo","máng chèn dōng fēng fàng zhǐ yuān"],"tr":"二月里草长莺飞，杨柳拂着堤岸，像醉在春烟里；孩子们放学回来早，赶忙趁着东风放风筝。","tag":"春天","em":"🌸"},{"t":"小池","a":"杨万里","lines":["泉眼无声惜细流，","树阴照水爱晴柔。","小荷才露尖尖角，","早有蜻蜓立上头。"],"py":["quán yǎn wú shēng xī xì liú","shù yīn zhào shuǐ ài qíng róu","xiǎo hé cái lù jiān jiān jiǎo","zǎo yǒu qīng tíng lì shàng tóu"],"tr":"泉眼悄悄流着细水，树荫映在水面，像喜爱这晴天的温柔；小荷叶刚露出尖尖角，就有蜻蜓立上头。","tag":"夏天","em":"☀️"},{"t":"所见","a":"袁枚","lines":["牧童骑黄牛，","歌声振林樾。","意欲捕鸣蝉，","忽然闭口立。"],"py":["mù tóng qí huáng niú","gē shēng zhèn lín yuè","yì yù bǔ míng chán","hū rán bì kǒu lì"],"tr":"小牧童骑着黄牛，歌声在树林里回荡；他忽然想捉知了，就闭上嘴，一动不动地站住。","tag":"童趣","em":"🪁"},{"t":"鹿柴","a":"王维","lines":["空山不见人，","但闻人语响。","返景入深林，","复照青苔上。"],"py":["kōng shān bù jiàn rén","dàn wén rén yǔ xiǎng","fǎn jǐng rù shēn lín","fù zhào qīng tái shàng"],"tr":"空空的山里看不见人，只听见有人说话的声音；夕阳返照进深林，又落在青苔上。","tag":"山水","em":"⛰️"},{"t":"鸟鸣涧","a":"王维","lines":["人闲桂花落，","夜静春山空。","月出惊山鸟，","时鸣春涧中。"],"py":["rén xián guì huā luò","yè jìng chūn shān kōng","yuè chū jīng shān niǎo","shí míng chūn jiàn zhōng"],"tr":"人闲下来，桂花轻轻飘落，夜静得春山空空；月亮出来惊动了山鸟，它们不时在春涧里叫几声。","tag":"春天","em":"🌸"},{"t":"九月九日忆山东兄弟","a":"王维","lines":["独在异乡为异客，","每逢佳节倍思亲。","遥知兄弟登高处，","遍插茱萸少一人。"],"py":["dú zài yì xiāng wèi yì kè","měi féng jiā jié bèi sī qīn","yáo zhī xiōng dì dēng gāo chù","biàn chā zhū yú shǎo yī rén"],"tr":"我一个人在异乡做客，每到过节就更想亲人；想到兄弟们今天登高插茱萸，一定发现少了我一个。","tag":"节日","em":"🏮"},{"t":"早发白帝城","a":"李白","lines":["朝辞白帝彩云间，","千里江陵一日还。","两岸猿声啼不住，","轻舟已过万重山。"],"py":["cháo cí bái dì cǎi yún jiān","qiān lǐ jiāng líng yī rì hái","liǎng àn yuán shēng tí bù zhù","qīng zhōu yǐ guò wàn zhòng shān"],"tr":"清晨告别彩云里的白帝城，一天就到了千里外的江陵；两岸猿声还在耳边，小船已驶过万重山。","tag":"山水","em":"⛰️"},{"t":"黄鹤楼送孟浩然之广陵","a":"李白","lines":["故人西辞黄鹤楼，","烟花三月下扬州。","孤帆远影碧空尽，","唯见长江天际流。"],"py":["gù rén xī cí huáng hè lóu","yān huā sān yuè xià yáng zhōu","gū fān yuǎn yǐng bì kōng jǐn","wéi jiàn zhǎng jiāng tiān jì liú"],"tr":"老朋友在黄鹤楼和我告别，在烟花三月去扬州；孤帆影子消失在碧空尽头，只看见长江向天边流。","tag":"送别","em":"👋"},{"t":"赋得古原草送别","a":"白居易","lines":["离离原上草，","一岁一枯荣。","野火烧不尽，","春风吹又生。"],"py":["lí lí yuán shàng cǎo","yī suì yī kū róng","yě huǒ shāo bù jǐn","chūn fēng chuī yòu shēng"],"tr":"原野上的草长得茂盛，一年枯一次又荣一次；野火烧不尽它，春风一吹又长出来。","tag":"送别","em":"👋"}],"l":[{"t":"望天门山","a":"李白","lines":["天门中断楚江开，","碧水东流至此回。","两岸青山相对出，","孤帆一片日边来。"],"py":["tiān mén zhōng duàn chǔ jiāng kāi","bì shuǐ dōng liú zhì cǐ huí","liǎng àn qīng shān xiāng duì chū","gū fān yī piàn rì biān lái"],"tr":"天门山从中间断开，碧绿的楚江奔流而出，到这里打了个回旋；两岸青山面对面出现，一片孤帆从日边驶来。","tag":"山水","em":"⛰️"},{"t":"山行","a":"杜牧","lines":["远上寒山石径斜，","白云生处有人家。","停车坐爱枫林晚，","霜叶红于二月花。"],"py":["yuǎn shàng hán shān shí jìng xié","bái yún shēng chù yǒu rén jiā","tíng chē zuò ài fēng lín wǎn","shuāng yè hóng yú èr yuè huā"],"tr":"沿着石头小路往深秋的山上走，白云飘处有人家；我停下车，只因爱这傍晚枫林，霜叶比二月花还红。","tag":"秋天","em":"🍂"},{"t":"饮湖上初晴后雨","a":"苏轼","lines":["水光潋滟晴方好，","山色空蒙雨亦奇。","欲把西湖比西子，","淡妆浓抹总相宜。"],"py":["shuǐ guāng liàn yàn qíng fāng hǎo","shān sè kōng méng yǔ yì qí","yù bǎ xī hú bǐ xī zi","dàn zhuāng nóng mǒ zǒng xiāng yí"],"tr":"晴天里西湖水光闪闪，下雨时山色朦朦胧胧，都很奇妙；要把西湖比作美人西施，淡妆浓妆都好看。","tag":"山水","em":"⛰️"},{"t":"题西林壁","a":"苏轼","lines":["横看成岭侧成峰，","远近高低各不同。","不识庐山真面目，","只缘身在此山中。"],"py":["héng kàn chéng lǐng cè chéng fēng","yuǎn jìn gāo dī gè bù tóng","bù shí lú shān zhēn miàn mù","zhǐ yuán shēn zài cǐ shān zhōng"],"tr":"横看是山岭，侧看是山峰，远近高低看都不一样；看不清庐山的真面目，只因为我自己就在山里。","tag":"山水","em":"⛰️"},{"t":"游子吟","a":"孟郊","lines":["慈母手中线，","游子身上衣。","临行密密缝，","意恐迟迟归。","谁言寸草心，","报得三春晖。"],"py":["cí mǔ shǒu zhōng xiàn","yóu zi shēn shàng yī","lín xíng mì mì fèng","yì kǒng chí chí guī","shuí yán cùn cǎo xīn","bào dé sān chūn huī"],"tr":"慈爱的母亲拿着针线，给出远门的孩子缝衣服，缝了又缝，怕他很久才回来；小草般的心意，怎么报答春天阳光一样的母爱呢？","tag":"思乡","em":"🏠"},{"t":"七步诗","a":"曹植","lines":["煮豆燃豆萁，","豆在釜中泣。","本是同根生，","相煎何太急？"],"py":["zhǔ dòu rán dòu qí","dòu zài fǔ zhōng qì","běn shì tóng gēn shēng","xiāng jiān hé tài jí"],"tr":"煮豆子用豆秸烧火，豆子在锅里哭泣；我们本来长在同一条根上，为什么要这么急着互相煎熬呢？","tag":"励志","em":"💪"},{"t":"长歌行","a":"佚名","lines":["青青园中葵，","朝露待日晞。","阳春布德泽，","万物生光辉。","常恐秋节至，","焜黄华叶衰。","百川东到海，","何时复西归？","少壮不努力，","老大徒伤悲。"],"py":["qīng qīng yuán zhōng kuí","cháo lù dài rì xī","yáng chūn bù dé zé","wàn wù shēng guāng huī","cháng kǒng qiū jié zhì","kūn huáng huá yè shuāi","bǎi chuān dōng dào hǎi","hé shí fù xī guī","shǎo zhuàng bù nǔ lì","lǎo dà tú shāng bēi"],"tr":"园里的葵菜青青，等着太阳晒干露水，春天让万物都发光；只怕秋天来了花叶枯黄，百川向东流入大海，什么时候才往西回？年轻不努力，老了只能白白伤悲。","tag":"励志","em":"💪"},{"t":"敕勒歌","a":"佚名","lines":["敕勒川，","阴山下。","天似穹庐，","笼盖四野。","天苍苍，","野茫茫，","风吹草低见牛羊。"],"py":["chì lēi chuān","yīn shān xià","tiān shì qióng lú","lóng gài sì yě","tiān cāng cāng","yě máng máng","fēng chuī cǎo dī jiàn niú yáng"],"tr":"敕勒川就在阴山脚下，天空像大帐篷盖住四面原野；天蓝蓝的，野地茫茫，风吹低了草，就看见成群的牛羊。","tag":"田园","em":"🌾"},{"t":"回乡偶书","a":"贺知章","lines":["少小离家老大回，","乡音无改鬓毛衰。","儿童相见不相识，","笑问客从何处来。"],"py":["shǎo xiǎo lí jiā lǎo dà huí","xiāng yīn wú gǎi bìn máo shuāi","ér tóng xiāng jiàn bù xiāng shí","xiào wèn kè cóng hé chù lái"],"tr":"小时候离开家乡，老了才回来，口音没变，两鬓的头发却白了；孩子们见了我都不认识，笑着问客人从哪儿来。","tag":"思乡","em":"🏠"},{"t":"咏柳","a":"贺知章","lines":["碧玉妆成一树高，","万条垂下绿丝绦。","不知细叶谁裁出，","二月春风似剪刀。"],"py":["bì yù zhuāng chéng yī shù gāo","wàn tiáo chuí xià lǜ sī tāo","bù zhī xì yè shuí cái chū","èr yuè chūn fēng shì jiǎn dāo"],"tr":"柳树像用碧玉打扮过，高高立着，千万条柳枝垂下来像绿丝带；不知细叶是谁裁的，原来是二月春风这把剪刀。","tag":"春天","em":"🌸"},{"t":"春夜喜雨","a":"杜甫","lines":["好雨知时节，","当春乃发生。","随风潜入夜，","润物细无声。","野径云俱黑，","江船火独明。","晓看红湿处，","花重锦官城。"],"py":["hǎo yǔ zhī shí jié","dāng chūn nǎi fā shēng","suí fēng qián rù yè","rùn wù xì wú shēng","yě jìng yún jù hēi","jiāng chuán huǒ dú míng","xiǎo kàn hóng shī chù","huā zhòng jǐn guān chéng"],"tr":"好雨懂得时节，春天一到就下起来，跟着风悄悄在夜里落，细细滋润万物不出声；天亮看那湿漉漉的地方，锦官城的花一定开得沉甸甸的。","tag":"春天","em":"🌸"},{"t":"竹石","a":"郑燮","lines":["咬定青山不放松，","立根原在破岩中。","千磨万击还坚劲，","任尔东西南北风。"],"py":["yǎo dìng qīng shān bù fàng sōng","lì gēn yuán zài pò yán zhōng","qiān mó wàn jī hái jiān jìn","rèn ěr dōng xī nán běi fēng"],"tr":"竹子紧紧咬住青山不放松，根扎在破岩石缝里；经历千万次磨难还是那么坚强，任凭东西南北风怎么吹。","tag":"励志","em":"💪"},{"t":"石灰吟","a":"于谦","lines":["千锤万凿出深山，","烈火焚烧若等闲。","粉骨碎身浑不怕，","要留清白在人间。"],"py":["qiān chuí wàn záo chū shēn shān","liè huǒ fén shāo ruò děng xián","fěn gǔ suì shēn hún bù pà","yào liú qīng bái zài rén jiān"],"tr":"石灰石经过千万次锤打凿挖才出深山，烈火烧它也当平常；就算粉身碎骨也不怕，只要把清白留在人间。","tag":"励志","em":"💪"},{"t":"墨梅","a":"王冕","lines":["我家洗砚池头树，","朵朵花开淡墨痕。","不要人夸好颜色，","只留清气满乾坤。"],"py":["wǒ jiā xǐ yàn chí tóu shù","duǒ duǒ huā kāi dàn mò hén","bù yào rén kuā hǎo yán sè","zhǐ liú qīng qì mǎn qián kūn"],"tr":"我家洗砚池边有一棵梅树，朵朵花开都带着淡淡墨痕；它不要人夸颜色好，只愿把清香留在天地间。","tag":"励志","em":"💪"},{"t":"观书有感","a":"朱熹","lines":["半亩方塘一鉴开，","天光云影共徘徊。","问渠那得清如许？","为有源头活水来。"],"py":["bàn mǔ fāng táng yī jiàn kāi","tiān guāng yún yǐng gòng pái huái","wèn qú nà dé qīng rú xǔ","wèi yǒu yuán tóu huó shuǐ lái"],"tr":"半亩方塘像一面打开的镜子，天光云影一起在水里晃动；问它怎么这样清澈，因为源头有活水不断流来。","tag":"励志","em":"💪"},{"t":"示儿","a":"陆游","lines":["死去元知万事空，","但悲不见九州同。","王师北定中原日，","家祭无忘告乃翁。"],"py":["sǐ qù yuán zhī wàn shì kōng","dàn bēi bù jiàn jiǔ zhōu tóng","wáng shī běi dìng zhōng yuán rì","jiā jì wú wàng gào nǎi wēng"],"tr":"我本来知道人死了就什么都没有，只难过没能看到国家统一；等到朝廷军队收复中原那天，祭祖时别忘了告诉你们的父亲。","tag":"励志","em":"💪"},{"t":"己亥杂诗","a":"龚自珍","lines":["九州生气恃风雷，","万马齐喑究可哀。","我劝天公重抖擞，","不拘一格降人才。"],"py":["jiǔ zhōu shēng qì shì fēng léi","wàn mǎ qí yīn jiū kě āi","wǒ quàn tiān gōng zhòng dǒu sǒu","bù jū yī gé jiàng rén cái"],"tr":"国家要有生气，得靠风雷一样的变革，万马都不出声实在让人悲哀；我劝老天爷重新振作，不要只用一种规格，让各种人才都降生。","tag":"励志","em":"💪"},{"t":"凉州词","a":"王之涣","lines":["黄河远上白云间，","一片孤城万仞山。","羌笛何须怨杨柳，","春风不度玉门关。"],"py":["huáng hé yuǎn shàng bái yún jiān","yī piàn gū chéng wàn rèn shān","qiāng dí hé xū yuàn yáng liǔ","chūn fēng bù dù yù mén guān"],"tr":"黄河远远伸上白云间，一座孤城立在万仞高山中；羌笛何必吹《折杨柳》埋怨春光，春风本来就吹不到玉门关外。","tag":"思乡","em":"🏠"}]};

const KEPU = {"s":[{"t":"为什么天会下雨","d":"云里的小水珠越聚越多、越来越重，空气托不住它们，就一颗颗落下来变成雨。","em":"🌧️"},{"t":"为什么会有白天和黑夜","d":"太阳出来照亮大地就是白天；太阳转到地球另一边，我们这里就变成黑夜。","em":"🌗"},{"t":"为什么冬天会下雪","d":"冬天太冷了，云里的小水珠冻成小冰晶，它们抱在一起飘下来，就是白白的雪。","em":"❄️"},{"t":"为什么夏天这么热","d":"夏天太阳照得又高又直，阳光特别强，地面被晒得暖暖的，所以我们觉得很热。","em":"☀️"},{"t":"为什么春天花开得特别多","d":"春天天气变暖、雨水也多，花草睡醒了，喝饱水就一朵接一朵地开花。","em":"🌸"},{"t":"为什么会有风","d":"空气跑动起来就是风。它从这边跑到那边，吹动树叶和风车，我们就感觉到风了。","em":"🍃"},{"t":"为什么天上会有云","d":"地上的水被太阳晒热，变成看不见的小水汽飞上天，聚在一起就变成白白的云。","em":"☁️"},{"t":"为什么先看到闪电后听到雷声","d":"闪电跑得比雷声快很多，所以我们先看见亮光，过一会儿才听见轰隆隆的雷声。","em":"⚡"},{"t":"为什么雨后地上有水坑","d":"雨点落在地上，泥土喝不完那么多水，水就积在低低的地方，变成小水坑。","em":"💧"},{"t":"为什么秋天树叶会变黄","d":"秋天天气变凉，树叶里的绿色慢慢退掉，露出黄颜色，风一吹就飘落下来。","em":"🍂"},{"t":"为什么小狗总爱吐舌头","d":"小狗身上汗腺少，天热时伸出舌头喘气，靠口水蒸发带走热量，就凉快多了。","em":"🐶"},{"t":"为什么小猫走路没有声音","d":"小猫脚底有软软的肉垫，走路时轻轻地落地，所以几乎听不到脚步声。","em":"🐱"},{"t":"为什么小兔子的耳朵那么长","d":"长长的耳朵能听到很远的声音，还能帮小兔子散热，让它跑得快又机灵。","em":"🐰"},{"t":"为什么小鸟会飞","d":"小鸟有轻巧的骨头和宽宽的翅膀，扇动翅膀就能借空气的力量飞起来。","em":"🐦"},{"t":"为什么鱼在水里能呼吸","d":"鱼用鳃呼吸，鳃能把水里的空气吸出来，所以鱼在水里也能自由地喘气。","em":"🐟"},{"t":"为什么蚂蚁总是一起走","d":"蚂蚁会留下气味当路标，后面的蚂蚁跟着气味走，就排成一条长长的队伍。","em":"🐜"},{"t":"为什么向日葵朝着太阳","d":"向日葵的小花盘喜欢追着阳光转，太阳走到哪里，它就把脸慢慢转向哪里。","em":"🌻"},{"t":"为什么蜗牛背着房子","d":"那是蜗牛的壳，是它自己长出来的家。遇到危险，它就把身体缩进壳里躲好。","em":"🐌"},{"t":"为什么含羞草一碰就合起来","d":"含羞草的叶子被碰到，会赶快合起来保护自己，过一会儿没人碰，它又慢慢张开。","em":"🌿"},{"t":"为什么小狗见到熟人摇尾巴","d":"小狗摇尾巴是在说我很开心、很喜欢你，它用这种方式跟熟人打招呼问好。","em":"🐕"},{"t":"为什么嘴巴能尝出味道","d":"舌头上有许多小味蕾，能尝出甜、酸、咸和苦，吃东西时它们帮我们分辨味道。","em":"👄"},{"t":"为什么蜜蜂要采花蜜","d":"蜜蜂把花蜜采回家，酿成甜甜的蜂蜜当食物，采蜜时还顺便帮花朵传粉。","em":"🐝"},{"t":"为什么月亮有时圆有时弯","d":"月亮自己不发光，我们看到的是被太阳照亮的部分，它转来转去，形状就变了。","em":"🌙"},{"t":"为什么星星会一闪一闪","d":"星星的光要穿过厚厚的空气，空气在动，光也跟着晃，看上去就像在眨眼睛。","em":"⭐"},{"t":"为什么太阳白天才出来","d":"太阳一直挂在天上，只是地球转呀转，转到我们面向太阳时，天就亮了。","em":"🌞"},{"t":"为什么晚上要睡觉","d":"睡觉时身体在休息、长个子，大脑也在整理白天学到的东西，睡醒了才有精神。","em":"😴"},{"t":"为什么眼睛会眨","d":"眨眼能给眼睛洗个澡，让它保持湿润，还能挡掉灰尘，保护眼睛不受伤。","em":"👀"},{"t":"为什么会有眼泪","d":"眼泪能冲洗眼睛里的灰尘，伤心或太开心时也会流出来，这是在表达心情。","em":"😢"},{"t":"为什么鼻子能闻到香味","d":"鼻子里有许多小小的嗅觉细胞，香味飘进去被它们抓住，我们就闻到味道了。","em":"👃"},{"t":"为什么小朋友会换牙","d":"小朋友长大了，小乳牙会慢慢松动掉落，再长出更结实的新牙，这就是换牙。","em":"🦷"},{"t":"为什么火山会喷火","d":"地底下藏着滚烫的岩石汤，像一锅烧得太久的粥，总想往外冒。找到缝隙，它就把热气和石头一起喷出来，像大地打了个大喷嚏。","em":"🌋"},{"t":"为什么天空是蓝色的","d":"太阳光看起来白白的，其实里面藏着好多颜色，像一盒彩色画笔。蓝颜色最爱在空气里跑来跑去，我们抬头一看，天空就被它涂蓝了。","em":"🌥"},{"t":"为什么草叶上会有露珠","d":"夜里天气变凉，空气里的小水汽碰到冷冷的草叶，就抱在一起变成小水珠。它们圆滚滚地挂在叶尖上，像小草醒来挂着的亮晶晶汗珠。","em":"💧"},{"t":"为什么早上会有雾","d":"夜里地面变冷，空气里的水汽靠在一起，变成许多飘在空中的小水珠。它们聚在低低的地方，像给房子和树盖了一层软软的薄棉被。","em":"🌫"},{"t":"为什么雪是白色的","d":"雪花是许多小冰粒拼成的，它们身上有好多小面，像无数小镜子把光送回来。各种颜色的光混在一起，我们的眼睛就看到白白的雪。","em":"🌨"},{"t":"为什么踩雪会咯吱响","d":"雪里藏着许多小小的空隙，脚一踩下去，雪粒被挤得紧紧靠在一起。它们你碰我、我碰你，发出细细的响声，像雪地在轻轻说话。","em":"👣"},{"t":"为什么太阳下山是红的","d":"太阳快落山时，光要穿过好长一段空气，蓝颜色的光跑着跑着就散了。红颜色最能坚持，留下来把天空和云朵染成暖暖的颜色。","em":"🌇"},{"t":"为什么月亮会跟着我走","d":"月亮离我们特别远，我们走一小段路，看它的位置几乎没变。就像远处的山，你边走边看，它也好像一直陪着你。","em":"🌙"},{"t":"为什么山谷里会有回声","d":"声音跑出去，碰到远远的山壁，就像皮球撞到墙，被弹了回来。弹回来的声音慢一点到达耳朵，我们就听到自己刚才喊的话。","em":"🏔"},{"t":"为什么企鹅不怕冷","d":"企鹅身上穿着厚厚的羽毛外套，里面还藏着一层软软的绒毛，冷风钻不进去。它们挤在一起时，像小朋友抱团取暖，更不怕冷了。","em":"🐧"},{"t":"为什么长颈鹿脖子长","d":"长颈鹿爱吃高高树上的嫩叶子，脖子长一点，就能先吃到好吃的。就像你踮起脚去够高处的果子，慢慢地，它的脖子就变得长长的。","em":"🦒"},{"t":"为什么斑马身上有条纹","d":"斑马的黑白条纹挤在一起，远远看去，一大群斑马像一片会动的花草地。狮子看久了会眼花，不容易盯住其中一匹，斑马就能趁机跑开。","em":"🦓"},{"t":"为什么大象鼻子那么长","d":"大象的长鼻子像一只万能的手，能卷起青草送进嘴里，也能吸水冲凉。它还能闻味道、和朋友打招呼，用处可多啦。","em":"🐘"},{"t":"为什么孔雀会开屏","d":"孔雀遇到喜欢的朋友，就把尾巴竖起来展开，像一把会抖动的大扇子。羽毛上亮亮的圆点晃来晃去，是在说你看我多漂亮呀。","em":"🦚"},{"t":"为什么青蛙呱呱叫","d":"青蛙的喉咙里有一个会鼓起来的小泡泡，一鼓一收，就发出呱呱的声音。夏天它们叫得欢，是在喊朋友一起玩，也在说这片池塘是我的家。","em":"🐸"},{"t":"为什么蜘蛛要结网","d":"蜘蛛不会飞，就吐出一根根细丝，编成一张有黏性的小网，像挂了一张会粘东西的吊床。小虫飞进来就动不了啦，蜘蛛就能吃到食物。","em":"🕸"},{"t":"为什么螃蟹横着走路","d":"螃蟹的腿关节像小门轴，只能往两边弯，不能往前弯。所以它走路时只能侧着身子，像小朋友横着挪步子，一溜烟就躲进石头缝。","em":"🦀"},{"t":"为什么乌龟走得那么慢","d":"乌龟背上的壳又重又硬，走起来像背着一间小房子，步子当然快不了。不过它慢慢走也有好处，不容易累，还能躲开危险。","em":"🐢"},{"t":"为什么刺猬身上长满刺","d":"刺猬身上硬硬的刺，是它随身带着的小盔甲。遇到危险，它把身子缩成一个小刺球，敌人就不敢碰它，只好走开。","em":"🦔"},{"t":"为什么松鼠要藏松果","d":"冬天找不到好吃的，松鼠就在秋天把松果埋进土里、塞进树洞。它像在给自己准备小粮仓，饿了就去取，有时忘记的松果还会长成小树。","em":"🐿"},{"t":"为什么公鸡早上要打鸣","d":"公鸡身体里有个小闹钟，天快亮时就会响，提醒它新的一天来了。它喔喔一叫，像在喊大家起床，也告诉大家这是我的地盘。","em":"🐓"},{"t":"为什么猫头鹰白天睡觉","d":"猫头鹰的眼睛在黑夜里特别亮，能看清小老鼠往哪儿跑。白天它躲在树洞里休息，像值夜班的守夜人，到了晚上才出来干活。","em":"🦉"},{"t":"为什么章鱼会喷墨汁","d":"章鱼遇到危险，就从肚子里喷出一团黑黑的墨汁，像放了一个大烟幕。海水一下子变模糊，敌人看不清路，章鱼就赶紧溜走啦。","em":"🐙"},{"t":"为什么仙人掌不怕渴","d":"仙人掌把水藏在自己胖胖的身体里，像背着一个大水壶。它的叶子变成小刺，不容易把水跑掉，所以很久不喝水也能精神神地站着。","em":"🌵"},{"t":"为什么荷叶上的水会滚","d":"荷叶表面有许多看不见的小毛毛，水珠站不稳，只好缩成圆滚滚的一团。风一吹，水珠就骨碌碌滚走，顺便把叶子上的灰尘也带走。","em":"🪷"},{"t":"为什么蒲公英会飞","d":"蒲公英的种子头上撑着一把小伞，风一吹就飘起来。它像坐着看不见的小飞机，去找一个空地方，明年在那里长出新蒲公英。","em":"🌼"},{"t":"为什么松树冬天还是绿的","d":"松树的叶子细细尖尖，像一根根小针，身上还穿着厚厚的蜡衣，不怕冷也不容易掉。别的树光着枝丫时，它还绿油油地站着。","em":"🌲"},{"t":"为什么西瓜里有好多籽","d":"西瓜籽就像西瓜的小宝宝，西瓜想请人吃瓜时把籽带到别处。籽落到土里，喝到雨水，就能长出新的西瓜苗，所以要多准备一些。","em":"🍉"},{"t":"为什么香蕉是弯弯的","d":"香蕉小时候，都朝着天上长，慢慢被后面的伙伴挤弯了腰。它们像一群手拉手的小朋友，弯弯地排在一起，这样更省地方。","em":"🍌"},{"t":"为什么洋葱切开会让人流泪","d":"洋葱里藏着会跑的小汽水，切开时它们钻进我们的眼睛。眼睛觉得不舒服，就赶紧流眼泪把它们冲走，像给眼睛洗个小澡。","em":"🧅"},{"t":"为什么辣椒会辣嘴巴","d":"辣椒里藏着一种会扎人的小东西，碰到舌头就让它热热的、痛痛的。我们的嘴巴以为被烫到了，赶紧想办法赶走它，所以会觉得辣。","em":"🌶"},{"t":"为什么蘑菇长在树底下","d":"蘑菇不喜欢大太阳，喜欢阴凉又潮湿的地方，树底下正好又凉快又舒服。它们像撑着小伞的小娃娃，悄悄从落叶和泥土里钻出来。","em":"🍄"},{"t":"为什么玉米长着胡须","d":"玉米头顶的胡须，其实是它的小细丝，每一根都连着一颗玉米粒。花粉落到胡须上，玉米粒才会慢慢长大，所以胡须可不能揪掉。","em":"🌽"},{"t":"为什么心脏一直在跳","d":"心脏像一个小小的打气筒，一下一下把血送到全身。我们睡觉时它也不休息，只是跳得慢一点，像默默干活的小帮手。","em":"🫀"},{"t":"为什么人会打喷嚏","d":"鼻子里跑进灰尘或小毛毛，鼻子觉得痒痒的，就想把它们赶出去。于是它用力喷出一口气，像给鼻子做一次大扫除。","em":"🤧"},{"t":"为什么人困了会打哈欠","d":"困的时候，身体想多吸一点新鲜空气，就张大嘴巴深深吸一口。打哈欠像给身体按一下休息键，提醒你和身边的人都该歇歇啦。","em":"🥱"},{"t":"为什么天热会出汗","d":"天热时，身体怕自己太烫，就从皮肤的小孔里冒出汗水。汗水慢慢变干，会把身上的热带走，我们就像给自己开了一台小空调。","em":"💦"},{"t":"为什么头发会越长越长","d":"头发是从头皮上的小坑里长出来的，就像小草从土里钻出来。只要小坑还在干活，头发就会慢慢往上长，所以要常常修剪。","em":"💇"},{"t":"为什么指甲要经常剪","d":"指甲一直在慢慢长，太长就容易藏脏东西，还可能抓疼自己。剪短以后，小手做事更方便，也更干净，像给指甲理个清爽的小短发。","em":"💅"},{"t":"为什么皮肤会晒黑","d":"太阳光太强时，皮肤会多做一些深颜色的小伞，帮自己挡住晒人的光。所以晒过太阳，皮肤就慢慢变黑了，像给自己撑起一层小遮阳伞。","em":"🌞"},{"t":"为什么伤口会结痂","d":"皮肤破了，身体马上派小帮手去补洞，先结一层硬硬的小盖子。它像给伤口贴了块天然的创可贴，等下面长好了，盖子就自己掉下来。","em":"🩹"},{"t":"为什么手指上有指纹","d":"手指肚上有一圈圈细细的花纹，像每个人的秘密记号。它能让手指捏东西更稳，也能帮警察叔叔认出这是谁的小手。","em":"👆"},{"t":"为什么小朋友会长高","d":"小朋友吃的饭菜变成身体的材料，骨头和肌肉一点点变长。就像小树喝水晒太阳会往上长，睡饱饱、吃好好，你也会慢慢长高。","em":"📏"},{"t":"为什么睡觉会做梦","d":"睡着以后，脑袋还在轻轻干活，把白天看到的事翻出来，像放小电影。有时电影很神奇，有时像真的一样，所以我们就会做梦。","em":"💤"},{"t":"为什么吃饱了会打嗝","d":"吃饭时，一些空气会跟着食物溜进肚子里，挤在一起变成小气泡。肚子想把它们送出去，就往上顶一下，我们便打出一个嗝。","em":"😮"},{"t":"为什么跑步后会喘气","d":"跑步时，身体需要更多力气，身体里的小风箱就快快工作，多吸一些新鲜空气。跑完以后，身体还没缓过来，我们就会大口大口地喘气。","em":"🏃"},{"t":"为什么面包里有许多小洞","d":"做面包时，面团里会冒出许多小气泡，像有人在里面吹泡泡。烤熟以后气泡不见了，却留下一个个小洞，面包才变得松松软软。","em":"🍞"},{"t":"为什么煮熟的虾会变红","d":"活虾身上盖着一层青灰色的外衣，里面藏着红颜色。热水一煮，外衣被烫散了，红颜色露出来，虾就变得红红的。","em":"🦐"},{"t":"为什么爆米花会爆开","d":"玉米粒里藏着一点点水，加热后水变成热气，在粒子里拼命想跑。外面那层硬皮挡不住，啪的一下被撑开，玉米就变成一朵小花。","em":"🍿"},{"t":"为什么可乐会冒泡泡","d":"可乐里藏着许多看不见的气，瓶盖一打开，它们就急着往外跑。小气泡一串串升上来，像在水里放了一串小烟花，喝起来还凉凉的。","em":"🥤"},{"t":"为什么米饭越嚼越甜","d":"米饭里藏着许多手拉手的小甜粒，我们嚼呀嚼，把它们分开。嘴里的小帮手一尝，发现有点甜，所以越嚼越有甜味。","em":"🍚"},{"t":"为什么饺子煮熟会浮起来","d":"饺子刚下锅时沉在锅底，里面还是紧紧的。煮熟后，馅里的热气把饺子撑得鼓鼓的，像吹了气的小船，就慢慢浮到水面上来。","em":"🥟"},{"t":"为什么雨伞能挡住雨","d":"雨伞的布上有一层看不见的防水衣，雨滴落上去站不住，只能顺着伞面滑下来。伞面弯弯的，像一个小屋顶，把雨都挡在外面。","em":"🌂"},{"t":"为什么湿衣服会变干","d":"衣服上的水会变成看不见的水汽，慢慢飞到空气里。太阳一晒、风一吹，水汽跑得更快，衣服就干爽爽的，像把水都送出去玩了。","em":"👕"},{"t":"为什么风扇吹着很凉快","d":"风扇转起来，把身边的空气推着跑，形成一阵阵风。风吹到我们身上，把汗水和热气带走，皮肤就凉凉的，像有人轻轻给我们扇扇子。","em":"🌬"},{"t":"为什么电梯能上上下下","d":"电梯被一根结实的绳子拉着，上面有轮子帮忙转，想上去就往上拉。它像一只会爬楼的小房间，按一下按钮，就带我们去想去的楼层。","em":"🛗"},{"t":"为什么红绿灯会变颜色","d":"红绿灯像路口的指挥员，用不同颜色告诉大家什么时候走、什么时候停。红灯亮时大家歇一歇，绿灯亮了再一起走，这样路上才不乱。","em":"🚦"},{"t":"为什么铅笔能写出字","d":"铅笔芯是黑黑的软石头做的，在纸上划过，就会留下一点点黑粉末。这些粉末粘在纸上，变成我们看到的字，像小蚂蚁排成的队伍。","em":"✏"},{"t":"为什么皮球能弹起来","d":"皮球里装满了空气，摔到地上时被压扁一下，马上又想鼓回来。它像装了弹簧的小胖子，借着这股劲又蹦得高高的。","em":"⚽"},{"t":"为什么肥皂能搓出泡泡","d":"肥皂遇到水，会变成一层滑滑的水衣，把空气包在里面。我们一搓，许多小泡泡就钻出来，像一群圆滚滚的小气球。","em":"🧼"}],"m":[{"t":"为什么雨后有彩虹","d":"雨停后，太阳光照到空气里的小水珠，光被分成七种颜色，就挂出一道彩虹。","em":"🌈"},{"t":"彩虹为什么是弯的","d":"彩虹是阳光在水珠里拐弯形成的，我们站在地上看，它就像一个弯弯的大拱门。","em":"🎨"},{"t":"彩虹一共有几种颜色","d":"彩虹一般有七种颜色：红、橙、黄、绿、蓝、靛、紫，它们排着队挂在天上。","em":"🖍️"},{"t":"为什么喷泉边也能看到彩虹","d":"阳光照到喷泉飞起的小水珠，也会像雨后那样把光分开，所以能看见小彩虹。","em":"⛲"},{"t":"为什么彩虹一会儿就不见了","d":"彩虹要靠太阳和小水珠一起帮忙，太阳躲进云里或水珠干了，彩虹就消失了。","em":"🌤️"},{"t":"为什么蝴蝶的翅膀那么漂亮","d":"蝴蝶翅膀上有一片片小鳞片，像彩色的粉末，阳光一照就闪闪发亮，特别好看。","em":"🦋"},{"t":"为什么蜜蜂蛰人以后会死","d":"蜜蜂的刺带着小钩，蛰人后拔不出来，它的身体会受伤，所以很少随便蛰人。","em":"🐝"},{"t":"为什么蚂蚁能搬动大东西","d":"蚂蚁虽然小，但力气很大，还能叫来许多伙伴一起抬，大家合力就搬得动。","em":"🐜"},{"t":"为什么蜻蜓要停在荷叶上","d":"蜻蜓飞累了要休息，荷叶稳稳地浮在水面，正好当它的小床，还能躲开危险。","em":"🦗"},{"t":"为什么萤火虫会发光","d":"萤火虫肚子里有会发光的物质，夜里一亮一暗像提着小灯笼，其实是在找好朋友。","em":"🪰"},{"t":"种子是怎么发芽的","d":"种子喝饱水，遇到暖暖的阳光，就会顶开外壳，冒出小芽，慢慢长成小苗。","em":"🌱"},{"t":"为什么植物要晒太阳","d":"植物靠阳光制造养分，就像我们吃饭一样，阳光不够，叶子就会发黄没精神。","em":"🌞"},{"t":"为什么花谢了会结果","d":"花开过后，花心里的子房慢慢长大，就变成甜甜的果实，里面藏着新的种子。","em":"🍎"},{"t":"树干上为什么有一圈圈花纹","d":"树干里有一圈圈年轮，大树长一年就多一圈，数一数就知道它几岁了。","em":"🌳"},{"t":"为什么小草被踩了还能长出来","d":"小草的根藏在土里，叶子被踩断，根还在，过几天又能冒出新的小叶子。","em":"🌿"},{"t":"吃下去的食物去哪里了","d":"食物先进肚子，再经过小肠大肠，有用的营养被身体吸收，剩下变成便便排出来。","em":"🍚"},{"t":"为什么肚子会咕咕叫","d":"肚子空了，胃里的空气和液体被挤来挤去，就发出咕咕的声音，提醒该吃饭啦。","em":"🫃"},{"t":"为什么吃饭要细嚼慢咽","d":"牙齿把食物嚼碎，肚子才容易消化；吃太快容易噎着，也尝不出饭菜的香味。","em":"🥢"},{"t":"为什么吃太多会肚子疼","d":"吃太多，胃被撑得满满的，来不及消化，就会胀胀地疼，所以要少吃一点。","em":"🤢"},{"t":"为什么我们要多喝水","d":"水能帮身体运送营养、赶走废物，出汗后更要补水，身体才不会干巴巴的。","em":"🥤"},{"t":"水为什么会结冰","d":"天气冷到零摄氏度以下，水会慢慢冻硬，变成一块块冰，摸上去又凉又滑。","em":"🧊"},{"t":"冰为什么会化成水","d":"冰遇到暖和的地方，会吸热变回水，所以手里的冰块一会儿就化成水珠。","em":"💧"},{"t":"水烧开时为什么冒白气","d":"水烧开后变成看不见的水蒸气，遇到冷空气又凝成小水珠，就成了白白的雾气。","em":"♨️"},{"t":"为什么玻璃上会有小水珠","d":"屋里暖暖的水汽碰到凉凉的玻璃，凝成一颗颗小水珠，就挂在窗户上了。","em":"🪟"},{"t":"为什么冬天嘴里会哈出白气","d":"嘴里呼出的气又暖又有水汽，遇到冷空气就凝成小水珠，看上去像一团白雾。","em":"🌬️"},{"t":"影子是怎么来的","d":"光被我们的身体挡住，照不到地上，就留下一块黑黑的影子，跟着我们一起动。","em":"🌑"},{"t":"为什么影子有时长有时短","d":"太阳低低的时候，影子被拉得很长；太阳在头顶时，影子就变得短短的。","em":"📏"},{"t":"为什么影子总跟着我","d":"影子是光被挡住的地方，我们走到哪儿，身体就挡到哪儿，影子自然跟到哪儿。","em":"🚶"},{"t":"为什么路灯下也有影子","d":"路灯的光从上面照下来，身体挡住光，地上就出现影子，越靠近灯影子越长。","em":"💡"},{"t":"为什么水里也有影子","d":"水面像镜子一样能照出人影，那是倒影，和地上黑黑的影子不一样哦。","em":"🪞"}],"l":[{"t":"为什么地球是圆的","d":"地球很大很大，我们站在上面感觉是平的，其实它像个大圆球，一直绕着太阳转。","em":"🌍"},{"t":"为什么会有四季","d":"地球斜着身子绕太阳转，不同时候阳光照的地方不一样，就分出春夏秋冬。","em":"🍁"},{"t":"为什么月亮上没有空气","d":"月亮太小，抓不住身边的空气，空气都跑光了，所以那里又安静又听不到声音。","em":"🌕"},{"t":"为什么会有日食","d":"月亮转到太阳和地球中间，挡住了太阳的光，白天就突然变暗，这就是日食。","em":"🌘"},{"t":"为什么海水会涨潮落潮","d":"月亮的引力拉着海水，海水被拉得一起一落，就形成了涨潮和退潮。","em":"🌊"},{"t":"海水为什么是咸的","d":"雨水把岩石和泥土里的盐冲进大海，水蒸发走了，盐留下来，海水就越变越咸。","em":"🧂"},{"t":"为什么海里会有波浪","d":"风吹过海面，把水推得一上一下，就形成了波浪，风越大浪就越高。","em":"🌊"},{"t":"海底为什么那么黑","d":"阳光照进海水，越往下越弱，到了深深的海底几乎照不到光，所以黑漆漆的。","em":"🐙"},{"t":"为什么鲸鱼要浮到水面呼吸","d":"鲸鱼用肺呼吸，不能在水里吸气，所以要浮到水面喷出水柱，大口换气。","em":"🐋"},{"t":"珊瑚是石头还是动物","d":"珊瑚是许多小珊瑚虫住在一起，它们留下硬硬的骨骼，慢慢长成彩色的珊瑚礁。","em":"🪸"},{"t":"恐龙为什么会消失","d":"很久以前有一颗大陨石撞上地球，灰尘挡住阳光，植物枯死，恐龙就慢慢灭绝了。","em":"🦕"},{"t":"恐龙都吃些什么","d":"有的恐龙吃树叶，叫植食恐龙；有的吃肉，叫肉食恐龙；牙齿形状能帮我们分辨。","em":"🦖"},{"t":"恐龙蛋有多大","d":"恐龙蛋大小不一，大的像篮球那么大，里面住着还没出生的小恐龙。","em":"🥚"},{"t":"我们怎么知道有恐龙","d":"科学家挖出恐龙的化石，从骨头、牙齿和脚印里，一点点拼出恐龙的样子。","em":"🦴"},{"t":"恐龙会飞吗","d":"恐龙不会飞，但有些恐龙长着翅膀能滑翔；会飞的翼龙其实不是恐龙。","em":"🕊️"},{"t":"火箭为什么能飞上天","d":"火箭往下喷出很快的气体，气体把它往上推，就能冲出地球飞向太空。","em":"🚀"},{"t":"宇航员在太空怎么走路","d":"太空里没有重力，宇航员会飘起来，要靠扶手慢慢移动，睡觉也要绑好。","em":"👨‍🚀"},{"t":"为什么在太空要穿宇航服","d":"太空又冷又没有空气，宇航服能供氧、保暖、挡住辐射，保护宇航员安全。","em":"🧑‍🚀"},{"t":"卫星是做什么的","d":"卫星绕着地球转，帮我们看电视、打电话、预报天气，还能给地面拍照。","em":"🛰️"},{"t":"为什么太空里听不到声音","d":"声音要靠空气传播，太空里几乎没有空气，所以宇航员只能靠无线电说话。","em":"🔇"},{"t":"为什么过马路要牵手","d":"马路上车开得快，小朋友个子小不容易被看见，牵手走才能安全过马路。","em":"🚦"},{"t":"为什么不能给陌生人开门","d":"陌生人可能是坏人，一个人在家时不要开门，要先打电话问爸爸妈妈。","em":"🚪"},{"t":"着火了该怎么办","d":"着火要弯下腰，用湿毛巾捂住鼻子，沿着安全出口往外跑，再打119求救。","em":"🚒"},{"t":"为什么不能玩插座","d":"电很厉害，手指伸进插座会被电到，很危险，插头和电器都要请大人来弄。","em":"🔌"},{"t":"为什么走路要看红绿灯","d":"红灯停、绿灯行，车辆都听红绿灯的指挥，看清信号再走就不会被撞到。","em":"🚥"},{"t":"为什么有的东西会浮在水上","d":"东西比同体积的水轻就会浮起来，像木头；铁块重，就会咕咚沉到水底。","em":"🪵"},{"t":"为什么磁铁能吸住铁","d":"磁铁有看不见的磁力，能牢牢吸住铁做的东西，但吸不住木头和塑料。","em":"🧲"},{"t":"声音是怎么传到耳朵里的","d":"东西振动发出声音，声音通过空气一波一波传过来，耳朵接住就听见了。","em":"👂"},{"t":"为什么轮船那么重还能浮着","d":"轮船里面是空的，装着很多空气，整体比水轻，所以能稳稳地浮在海面上。","em":"🚢"},{"t":"为什么敲鼓会咚咚响","d":"鼓面被敲得振动起来，振动通过空气传到我们耳朵，就听到咚咚的鼓声。","em":"🥁"}]};

const TUOZHAN = {"s":{"know":[{"t":"天为什么是蓝色的","d":"太阳光照进空气，蓝色光最容易被撞散，我们抬头就看到蓝蓝的天。","em":"🌈"},{"t":"小鸟为什么会飞","d":"小鸟有翅膀，骨头很轻，里面还是空心的，用力扇动翅膀就能飞上天空。","em":"🐦"},{"t":"鱼在水里怎么呼吸","d":"鱼用鳃呼吸，鳃能把水里的空气留下来，所以鱼不用浮出水面换气。","em":"🐟"},{"t":"蚂蚁为什么排队走","d":"蚂蚁走路会留下气味，后面的蚂蚁跟着气味往前走，就排成一条长队。","em":"🐜"},{"t":"彩虹是怎么来的","d":"雨后空气里飘着许多小水珠，阳光穿过这些水珠，就分成七种颜色。","em":"🌈"},{"t":"月亮为什么跟着我走","d":"月亮离我们很远很远，我们只走一小段路，看起来它好像没有在动。","em":"🌙"},{"t":"小猫为什么怕水","d":"猫毛沾了水会变重，身体也会变冷，所以大多数猫都不太喜欢洗澡。","em":"🐱"},{"t":"兔子耳朵为什么长","d":"长长的耳朵能听到很远的声音，还能帮兔子把身上多余的热气散出去。","em":"🐰"},{"t":"树叶秋天为什么变黄","d":"天气变冷以后，树叶里的绿色变少了，藏在里面的黄色就露了出来。","em":"🍂"},{"t":"蜜蜂为什么采花蜜","d":"蜜蜂把采到的花蜜带回蜂巢酿成蜂蜜，留着当冬天里吃的粮食，真聪明。","em":"🐝"},{"t":"人为什么要睡觉","d":"睡觉的时候身体在休息，也在悄悄长个子，睡够了白天才有精神玩。","em":"😴"},{"t":"雪为什么是白色的","d":"雪花是由许多小冰晶组成，光在里面来回反射，看起来就是白色的。","em":"❄️"}],"exp":[{"t":"会开花的纸","d":"把彩纸剪成小花，花瓣往中间折好，轻轻放进水里，花瓣会自己打开。","em":"🌸"},{"t":"沉下去还是浮起来","d":"把木块、勺子和塑料玩具放进水盆，看看谁浮在水上，谁沉到底。","em":"🛁"},{"t":"糖去哪儿了","d":"把一勺糖放进温水里搅一搅，糖不见了，尝一口水是甜的。","em":"🍬"},{"t":"会吸水的纸巾","d":"把纸巾的一头放进有颜色的水里，看水顺着纸巾慢慢爬上来。","em":"🧻"},{"t":"会跳舞的葡萄干","d":"把葡萄干放进汽水里，气泡抱着它升上去，到水面又落下来。","em":"🍇"},{"t":"气球鼓起来了","d":"把气球套在空瓶口，用热水浇一浇瓶身，气球会慢慢鼓起来。","em":"🎈"},{"t":"盐画","d":"在纸上涂满胶水，撒上盐，再滴几滴颜料，盐会把颜色吸过去。","em":"🧂"},{"t":"小纸船下水","d":"用纸折一只小船放进水里，看看它能漂多久，会不会被泡软。","em":"⛵"},{"t":"冰块变小了","d":"把冰块放进一杯温水里，看它一点点变小，最后不见了，水也变多了。","em":"🧊"},{"t":"会响的杯子","d":"手指蘸点水，沿着玻璃杯口慢慢画圈，杯子会发出嗡嗡的声音。","em":"🥃"},{"t":"彩色牛奶","d":"盘里倒一点牛奶，滴几滴颜料，用棉签蘸洗洁精点一下，颜色会跑开。","em":"🥛"},{"t":"会站立的鸡蛋","d":"在桌上撒一小撮盐，把鸡蛋大头朝下立在盐上，盐粒帮它站稳。","em":"🥚"}],"story":[{"t":"小兔子的红雨伞","d":"下雨了，小兔子撑着红雨伞出门。路上它看见小鸡在淋雨，就把伞举到小鸡头上。小鸡说：谢谢你的伞。两个好朋友一起走回家，谁也没有淋湿。","em":"🌂"},{"t":"小熊的蜂蜜罐","d":"小熊找到一罐蜂蜜，舍不得一次吃完。它每天只舀一小勺，还分给邻居小刺猬。冬天过去，蜂蜜吃完了，小熊却多了一个好朋友，它觉得这样更甜。","em":"🍯"},{"t":"小蚂蚁搬米粒","d":"一只小蚂蚁发现一粒米，自己搬不动。它跑回家叫来好多伙伴，大家一起用力抬，米粒终于搬回了家。小蚂蚁明白了：一起用力，事情就变简单。","em":"🐜"},{"t":"小鸭子学游泳","d":"小鸭子不敢下水，站在岸边直发抖。鸭妈妈先游给它看，小鸭子鼓起勇气跳了下去，扑通扑通，不一会儿就游得稳稳的，开心地叫起来。","em":"🦆"},{"t":"月亮找朋友","d":"月亮一个人挂在天上，有点孤单。它把光洒进小窗，陪小女孩睡觉。小女孩梦见月亮，笑着说：晚安，好朋友。月亮听了，也笑了，一直守到天亮。","em":"🌙"},{"t":"小猫的新鞋子","d":"妈妈给小猫买了新鞋，小猫穿着去踩水坑。鞋子湿了，小猫有点难过。妈妈把鞋晒在窗台上说：没关系，晒一晒就干了。第二天，鞋子真的干了。","em":"🐱"},{"t":"小花狗看家","d":"爸爸妈妈出门，小花狗留在家里看家。它坐在门口哪儿也不去，一直等到家人回来，才摇着尾巴迎上去。家人摸摸它的头，夸它是个好孩子。","em":"🐕"},{"t":"会唱歌的小鸟","d":"小鸟在树上唱歌，声音非常动听。小松鼠听着听着睡着了，醒来后对小鸟说：谢谢你，我睡了一个好觉。小鸟听了，高兴地又唱了起来。","em":"🐦"},{"t":"小刺猬的苹果","d":"小刺猬捡到一个大苹果，背上的刺正好扎住它。它把苹果背回家，和妈妈一人一半，吃得甜甜的。妈妈说：这是分享的味道。小刺猬点点头，笑了。","em":"🦔"},{"t":"小乌龟慢慢走","d":"小乌龟走路很慢，小兔子常常笑它。可下雨时小兔子没带伞，小乌龟把背上的壳借给它挡雨。小兔子不好意思地说：以后我再也不笑你了。","em":"🐢"},{"t":"云朵做枕头","d":"小羊睡不着，数着窗外的云朵。云朵软软的，像一只大枕头。数着数着，小羊慢慢地闭上了眼睛，睡得又香又甜。月亮也悄悄地躲进云里睡了。","em":"☁️"},{"t":"小树苗喝水","d":"小树苗口渴了，叶子有点耷拉。小女孩提来一小桶清水，慢慢地浇在根部。第二天，小树苗的叶子又抬起来了，小女孩开心地拍起手来。","em":"🌱"}],"song":[{"t":"《小星星》","d":"一闪一闪亮晶晶，满天都是小星星","em":"⭐"},{"t":"《两只老虎》","d":"两只老虎，两只老虎，跑得快，跑得快","em":"🐯"},{"t":"《数鸭子》","d":"门前大桥下，游过一群鸭","em":"🦆"},{"t":"《小燕子》","d":"小燕子，穿花衣，年年春天来这里","em":"🐦"},{"t":"《拔萝卜》","d":"拔萝卜，拔萝卜，嘿哟嘿哟拔萝卜","em":"🥕"},{"t":"《找朋友》","d":"找呀找呀找朋友，找到一个好朋友","em":"🤝"},{"t":"《丢手绢》","d":"丢手绢，丢手绢，轻轻地放在小朋友的后面","em":"🧣"},{"t":"《小兔子乖乖》","d":"小兔子乖乖，把门儿开开","em":"🐰"},{"t":"《世上只有妈妈好》","d":"世上只有妈妈好，有妈的孩子像块宝","em":"👩"},{"t":"《我上幼儿园》","d":"爸爸妈妈去上班，我上幼儿园","em":"🎒"},{"t":"《小手拍拍》","d":"小手拍拍，小手拍拍，手指伸出来","em":"👐"},{"t":"《哈巴狗》","d":"一只哈巴狗，坐在大门口","em":"🐶"}],"chal":[{"t":"自己把鞋子摆整齐","d":"","em":"👟"},{"t":"单脚站立 10 秒","d":"","em":"🦶"},{"t":"自己用勺子吃完一餐","d":"","em":"🥄"},{"t":"把玩具送回玩具箱","d":"","em":"🧸"},{"t":"大声说一句谢谢","d":"","em":"🙏"},{"t":"自己穿好袜子","d":"","em":"🧦"},{"t":"数一数家里有几扇门","d":"","em":"🚪"},{"t":"给家人倒半杯水","d":"","em":"💧"},{"t":"学一种小动物的叫声","d":"","em":"🐮"},{"t":"帮妈妈递一样东西","d":"","em":"🤲"},{"t":"自己把小手洗干净","d":"","em":"🧼"},{"t":"起床后自己穿好上衣","d":"","em":"👕"}]},"m":{"know":[{"t":"天空为什么会下雨","d":"水被太阳晒成水汽升上天空，聚成云，云里的小水珠变重就落下来。","em":"🌧️"},{"t":"影子为什么有长有短","d":"太阳很低的时候影子长，太阳升到头顶的时候，影子就变得最短了。","em":"🌞"},{"t":"种子没土也能发芽吗","d":"只要有了水、空气和合适的温度，有些种子放在湿纸巾上也能发芽。","em":"🌱"},{"t":"为什么会有回声","d":"声音撞到远处的墙壁会弹回来，再传进我们的耳朵里，就听到回声。","em":"🔊"},{"t":"冰为什么会化成水","d":"冰遇到热会变回水，把它放在很暖和的地方，冰块就会慢慢化掉了。","em":"🧊"},{"t":"为什么先看到闪电","d":"光跑得比声音快得多，所以总是先看见闪电，过一会儿才能听到雷声。","em":"⚡"},{"t":"蜗牛背上为什么有壳","d":"壳是蜗牛随身的小房子，遇到危险就缩进去，还能帮它保住了水分。","em":"🐌"},{"t":"蜘蛛网为什么粘虫子","d":"蜘蛛网上有黏黏的丝，虫子一碰到就被粘住，蜘蛛自己走不黏的线。","em":"🕷️"},{"t":"人为什么要刷牙","d":"嘴巴里有看不见的细菌，刷牙能把它们都赶出去，牙齿就不容易坏。","em":"🦷"},{"t":"大象的鼻子有什么用","d":"大象用长长的鼻子呼吸、喝水、洗澡，还能卷起东西，像手一样灵活。","em":"🐘"},{"t":"海水为什么是咸的","d":"雨水把石头和泥土里的盐分冲进大海，海水蒸发了，盐就留了下来。","em":"🌊"},{"t":"毛毛虫怎么变蝴蝶","d":"毛毛虫吃饱后结成蛹，在蛹里慢慢发生变化，最后钻出来变成蝴蝶。","em":"🦋"}],"exp":[{"t":"会吹气球的瓶子","d":"瓶里放两勺小苏打，再倒进白醋，马上套上气球，气球会被吹起来。","em":"🎈"},{"t":"会跳舞的盐粒","d":"把保鲜膜绷在碗口，撒上盐粒，对着它大声喊，盐粒会跳起来。","em":"🧂"},{"t":"盐水浮鸡蛋","d":"杯里倒水放进鸡蛋会沉底，加几勺盐搅化后，鸡蛋慢慢浮上来。","em":"🥚"},{"t":"小苏打火山","d":"用纸杯堆成小山，放进小苏打，再倒白醋，泡沫像岩浆一样冒出来。","em":"🌋"},{"t":"会拐弯的水流","d":"用毛巾快速擦塑料勺，再靠近细细的水流，水流会被吸得弯过来。","em":"💧"},{"t":"会吸纸屑的气球","d":"把气球在头发上蹭几下，靠近碎纸屑，纸屑会被吸到气球上。","em":"🎈"},{"t":"墙上的彩虹","d":"把镜子斜着放进水盆，对着阳光调整角度，墙上会出现一道彩虹。","em":"🌈"},{"t":"醋写的密信","d":"用棉签蘸白醋在纸上写字，干了以后靠近温热的地方烤一烤，字会变深。","em":"✉️"},{"t":"会转的纸蛇","d":"把纸剪成螺旋的长条挂起来，放在热水杯上方，热气会让它转起来。","em":"🐍"},{"t":"油和水分层","d":"杯里先倒水再倒油，静置一会儿会分成两层，油总是浮在上面。","em":"🫗"},{"t":"纸片托水","d":"杯子装满水，盖上纸片，按住倒过来再松手，纸片能托住水不掉。","em":"📄"},{"t":"会变软的蛋壳","d":"把生鸡蛋泡在白醋里两天，蛋壳会慢慢变软，摸起来像弹力球。","em":"🥚"}],"story":[{"t":"小狐狸的围巾","d":"天冷了，小狐狸织了一条长长的围巾。路上它看见小兔冻得发抖，就把围巾分了一半。两个人围着一条围巾回家，一点也不冷。小兔说：明天我也给你织一段。","em":"🦊"},{"t":"会飞的纸飞机","d":"小男孩折了一架纸飞机，用力一扔，飞机飞过院子落在树上。他搬来小凳子够下来，又试了一次，这次飞机飞得更远了。他高兴地追着飞机跑。","em":"✈️"},{"t":"小雨滴的旅行","d":"小雨滴从云里落下来，落进小河，又流进大海。太阳一晒，它变成水汽飞回天上，回到云妈妈身边，准备下一次旅行。它说：旅行真有趣。","em":"💧"},{"t":"小松鼠存松果","d":"秋天到了，小松鼠每天捡松果藏进树洞。冬天大雪盖住森林，它打开树洞，里面还有满满一堆粮食，够吃一整个冬天。它安心地睡了个好觉。","em":"🌰"},{"t":"谁的影子","d":"小狗和小猫在灯下玩，地上出现两个影子。小狗追着自己的影子跑，怎么也追不上，笑得在地上直打滚。小猫也追起来，两个影子晃来晃去。","em":"🐕"},{"t":"小蜜蜂送信","d":"小蜜蜂在花丛里飞来飞去，帮花儿传递花粉。花儿结出了果子。秋天果子熟了，花儿对小蜜蜂说：谢谢你，辛苦了。小蜜蜂嗡嗡地笑了。","em":"🐝"},{"t":"勇敢的小老鼠","d":"小老鼠第一次自己出门，走到半路想回头。它深深吸了一口气，一步一步往前走，终于看见了外婆家亮着的灯。外婆站在门口，笑着张开手臂。","em":"🐭"},{"t":"小猪的生日","d":"今天是小猪的生日，它烤了一个大蛋糕。朋友们带来水果和蜡烛，大家一起唱歌，小猪闭上眼睛许了一个愿望。吹灭蜡烛时，大家都拍起手来。","em":"🎂"},{"t":"彩虹桥","d":"雨停了，天上出现一道彩虹。小兔说那是桥，小猴说那是滑梯。它们抬头看了很久，彩虹慢慢变淡，不见了。小兔说：明天再下一场雨吧。","em":"🌈"},{"t":"小鸭子找妈妈","d":"小鸭子走散了，急得嘎嘎叫。它顺着河边的脚印找，绕过一棵大树，终于看见妈妈在对岸向它挥手。它飞快地游过去，扑进妈妈的怀里。","em":"🦆"},{"t":"不爱刷牙的小熊","d":"小熊不爱刷牙，牙齿上长了小黑点。牙医帮它补好牙，它每天早晚认真刷牙，牙齿又白又亮，吃什么都香。它还想：以后再也不偷懒了。","em":"🦷"},{"t":"一颗种子","d":"春天，小男孩把一颗种子埋进土里。他每天浇水，等了好多天，终于冒出两片小芽。他高兴得跳起来，说：你终于醒了。小芽在风里轻轻点头。","em":"🌱"}],"song":[{"t":"《采蘑菇的小姑娘》","d":"采蘑菇的小姑娘，背着一个大竹筐","em":"🍄"},{"t":"《春天在哪里》","d":"春天在哪里呀，春天在哪里","em":"🌷"},{"t":"《上学歌》","d":"太阳当空照，花儿对我笑","em":"🌞"},{"t":"《一分钱》","d":"我在马路边，捡到一分钱","em":"🪙"},{"t":"《粉刷匠》","d":"我是一个粉刷匠，粉刷本领强","em":"🖌️"},{"t":"《铃儿响叮当》","d":"叮叮当，叮叮当，铃儿响叮当","em":"🔔"},{"t":"《泥娃娃》","d":"泥娃娃，泥娃娃，一个泥娃娃","em":"🧸"},{"t":"《蜗牛与黄鹂鸟》","d":"阿门阿前一棵葡萄树，阿嫩阿嫩绿地刚发芽","em":"🐌"},{"t":"《劳动最光荣》","d":"太阳光金亮亮，雄鸡唱三唱","em":"🐓"},{"t":"《小毛驴》","d":"我有一只小毛驴，我从来也不骑","em":"🫏"},{"t":"《虫儿飞》","d":"黑黑的天空低垂，亮亮的繁星相随","em":"🦋"},{"t":"《幸福拍手歌》","d":"如果感到幸福你就拍拍手，如果感到幸福你就拍拍手","em":"👏"}],"chal":[{"t":"帮家人摆好三双筷子","d":"","em":"🥢"},{"t":"单脚站立 20 秒","d":"","em":"🦶"},{"t":"自己整理一次小书包","d":"","em":"🎒"},{"t":"讲一个今天听到的故事","d":"","em":"📖"},{"t":"把脏衣服放进洗衣篮","d":"","em":"🧺"},{"t":"从 20 倒数到 1","d":"","em":"🔢"},{"t":"帮家人擦一次桌子","d":"","em":"🧽"},{"t":"给家里的植物浇一次水","d":"","em":"🌿"},{"t":"用积木搭一座小桥","d":"","em":"🧱"},{"t":"说出今天的日期","d":"","em":"📅"},{"t":"自己叠好一件小衣服","d":"","em":"👕"},{"t":"和小朋友分享一样玩具","d":"","em":"🧸"}]},"l":{"know":[{"t":"为什么一年有四季","d":"地球斜着身子绕太阳转，各地得到的阳光时多时少，于是有了四季。","em":"🍀"},{"t":"为什么有白天和黑夜","d":"地球自己不停地转着圈，被太阳照到的一面是白天，背面就是黑夜。","em":"🌍"},{"t":"月亮为什么会圆缺","d":"月亮自己不发光，我们看到的亮面大小每天在变，于是有了圆和缺。","em":"🌙"},{"t":"船为什么能浮在水上","d":"船里面装了很多空气，整条船比同体积的水轻，所以能浮在水面上。","em":"⛵"},{"t":"铁为什么会生锈","d":"铁遇到水和空气会慢慢发生变化，长出红红的铁锈，还会变得很脆。","em":"🔩"},{"t":"镜子为什么能照人","d":"镜子背面涂了一层亮亮的金属，光被弹回来，就照出了我们的样子。","em":"🪞"},{"t":"风筝为什么能飞上天","d":"风筝迎着风，风把它往上托，手里牵着的线拉住它，它就飞起来了。","em":"🪁"},{"t":"人为什么要多喝水","d":"身体里大部分都是水，出汗和呼吸都会失去水分，多喝水才能补回来。","em":"💧"},{"t":"小朋友为什么会换牙","d":"小时候的乳牙又小又不结实，换上的恒牙更大更硬，要用上一辈子。","em":"🦷"},{"t":"影子为什么跟着人","d":"光被我们的身体挡住，地上就会留下一块暗暗的地方，那就是影子。","em":"👤"},{"t":"树叶秋天为什么落下","d":"天冷了，树叶运送水分变得很难，树就让它落下来，省下力气过冬。","em":"🍁"},{"t":"冰为什么浮在水上","d":"冰比同体积的水要轻，所以冰块浮在水面上，还能帮水下的鱼挡冷。","em":"🧊"}],"exp":[{"t":"会变色的白花","d":"把白花插进有颜色的水里，过半天再看，花瓣会染上淡淡的颜色。","em":"🌼"},{"t":"自制小天平","d":"用衣架和两个纸杯做一架小天平，比一比两块橡皮哪个更重一些。","em":"⚖️"},{"t":"会跳的硬币","d":"把硬币放在瓶口，双手捂住瓶身一会儿，硬币会自己轻轻跳动。","em":"🪙"},{"t":"哪种纸最吸水","d":"把纸巾、报纸和彩纸同时泡进水里，比一比哪种纸吸得最快。","em":"🧻"},{"t":"橡皮泥小船","d":"用橡皮泥捏一只小船放进水里，往船里放硬币，数数放几枚会沉。","em":"🛶"},{"t":"盐和冰","d":"把冰块放进碗里撒上盐，冰会化得更快，摸一摸碗底也变得很凉。","em":"🧂"},{"t":"彩虹糖彩带","d":"把彩虹糖摆在盘子边上，倒一点温水，颜色会向中间流成彩带。","em":"🍬"},{"t":"会沉的橘子","d":"把没剥皮的橘子放进水里会浮着，剥了皮再放进去，它却沉下去了。","em":"🍊"},{"t":"空气占地方","d":"把纸团塞进杯底，杯口朝下压进水里，纸团不会湿，因为空气占着地方。","em":"📄"},{"t":"水滴放大镜","d":"在保鲜膜上滴一滴水，举到字的上方，透过水滴看，字会变大。","em":"🔍"},{"t":"手影变大变小","d":"用手电筒照玩具，把手电筒拿远再拿近，看看影子怎么变大变小。","em":"🔦"},{"t":"会隐身的画","d":"用白蜡笔在白纸上画一幅画，再用颜料涂满整张纸，画就出现了。","em":"🖍️"}],"story":[{"t":"两颗种子","d":"两颗种子埋在土里。一颗说太黑了不敢发芽，一颗使劲往上长。春天来了，一颗长成了小树，另一颗还埋在土里睡大觉。小树摇着叶子说：往上长才能看见太阳。","em":"🌰"},{"t":"小蚂蚁过河","d":"小蚂蚁要过河，可河上没有桥。它找来一片树叶当船，一根小树枝当桨，风一吹，慢慢漂到了对岸。它回头看看树叶船，心里说：谢谢你。","em":"🍃"},{"t":"会算数的小猴","d":"小猴摘了五个桃子，送给小兔两个。它掰着手指算：五减二等于三。剩下的三个，它带回家给妈妈尝。妈妈夸它：会算数，还懂得分享。","em":"🐵"},{"t":"找不到的袜子","d":"小明总把袜子乱丢。早上要出门，怎么也找不到另一只。他找遍床底和柜子，最后在书包里摸到了它。他红着脸说：以后一定把袜子放整齐。","em":"🧦"},{"t":"路边的小石头","d":"路中间有块小石头，大家都绕开走。小男孩弯腰把它搬到路边，后来推车的爷爷经过，不再颠簸了。爷爷笑着说：真是个懂事的好孩子。","em":"🪨"},{"t":"小树和风","d":"大风来了，小树被吹得弯下了腰。它咬牙站住，树根往土里扎得更深。风停了，小树站得比以前更直更稳。它想：原来风也能让我变强壮。","em":"🌳"},{"t":"蜗牛看海","d":"蜗牛想去看大海，可它走得很慢。它一天走一点点，路上认识了很多朋友。等它到海边时，已经长成大蜗牛了。它说：慢慢走，也能到远方。","em":"🐌"},{"t":"分一半的午饭","d":"中午，小华发现同桌忘了带饭。他把自己的饭分了一半，两个人一起吃。下午同桌帮他讲会了一道数学题。小华想：帮助别人，自己也会开心。","em":"🍚"},{"t":"灯下的影子","d":"晚上，女孩用手电筒照玩具。手电筒拿远一点，影子变小；拿近一点，影子又变大。她想：原来光越近，影子越大。她把这个发现告诉了妈妈。","em":"🔦"},{"t":"小乌龟的壳","d":"小乌龟嫌自己的壳又重又丑。可下雨时它躲在壳里，一点也没淋湿。它想：原来我的壳这么有用。从那以后，它再也不嫌壳丑了，走路也更神气了。","em":"🐢"},{"t":"存钱罐的秘密","d":"小女孩每天往存钱罐里放一枚硬币。半年后她打开罐子，数一数，够买一本想看很久的书了，笑得眼睛弯弯。她把书抱在怀里，觉得特别珍贵。","em":"🐷"},{"t":"妈妈的手表","d":"妈妈要去上班，孩子舍不得。妈妈指着手表说：指针走到这里，我就回来。那天下午，门真的准时响了。孩子扑过去说：妈妈真守信用。","em":"⌚"}],"song":[{"t":"《卖报歌》","d":"啦啦啦，啦啦啦，我是卖报的小行家","em":"📰"},{"t":"《小螺号》","d":"小螺号，嘀嘀嘀吹，海鸥听了展翅飞","em":"🐚"},{"t":"《娃哈哈》","d":"我们的祖国是花园，花园里花朵真鲜艳","em":"🌺"},{"t":"《让我们荡起双桨》","d":"让我们荡起双桨，小船儿推开波浪","em": let Q = null;
function startQuiz(key, count, build, food, title){
  Q = { key, food, title, idx:0, right:0, total:count,
        list: Array.from({length:count},()=>build()) };
  renderQuiz();
}
function renderQuiz(){
  const q = Q.list[Q.idx];
  const pct = Math.round(Q.idx/Q.total*100);
  const opts = q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(this,${i})">${o}</button>`).join('');
  const cols = (q.options.length<=2 ? 'one ' : '') + (q.big ? 'big' : '');
  $('#viewRoot').innerHTML = `
    <div class="page-head"><h1>${Q.title}</h1><span class="sub">第 ${Q.idx+1} / ${Q.total} 题 · 答对 ${Q.right}</span></div>
    <div class="bar" style="margin-bottom:16px"><i style="width:${pct}%"></i></div>
    <div class="learn-card">
      <div class="q-head"><span class="pill">${q.type||'练习'}</span>
        <button class="speak-btn" onclick="speak('${esc(q.speakText||q.prompt)}','${q.speakText?'en-US':'zh-CN'}')">${q.speakText?'🔊 再听一遍':'🔊 读题'}</button></div>
      <div class="q-prompt">${q.prompt}</div>
      ${q.visual?`<div class="q-visual">${q.visual}</div>`:''}
      <div class="options ${cols}">${opts}</div>
      ${q.hint?`<div class="muted" style="margin-top:12px;font-size:13px">${q.hint}</div>`:''}
    </div>`;
  if(q.speakText) setTimeout(()=>{ try{ speak(q.speakText,'en-US'); }catch(e){} }, 350);
}
function answer(el, i){
  if(Q.locked) return;
  const q = Q.list[Q.idx];
  const ansIdx = (typeof q.correct==='number') ? q.correct : q.ans;
  if(i===ansIdx){
    Q.locked=true; Q.right++;
    el.classList.add('correct');
    sfx.ok();
    S.stats.todayRight++; S.stats.right++; S.stats.streakRight++;
    S.stats.todayDone++; S.stats.done++;
    if(Q && (Q.key==='suan' || Q.key==='math')) goalAdd('math');
    grant(Q.food,{silent:true});
    petCheer(true);
    setTimeout(()=>{ if(!Q) return; Q.locked=false; nextQ(); }, 900);
  }else{
    el.classList.add('wrong');
    sfx.no();
    S.stats.streakRight=0;
    S.stats.todayDone++; S.stats.done++;
    S.wrong.push({module:Q.title, q:q.prompt, visual:q.visual||'', right:q.options[ansIdx], time:new Date().toLocaleString('zh-CN'), key:Q.key});
    save();
    petCheer(false);
    const msg = pick(['没关系，再试试哦','再想一想，你可以的','差一点点，再来一次']);
    toast('💛 '+msg);
    setTimeout(()=>el.classList.remove('wrong'), 500);
  }
  renderChrome();
}
function nextQ(){
  if(!Q) return;
  Q.idx++;
  if(Q.idx>=Q.total){
    const rate = Math.round(Q.right/Q.total*100);
    const cb = Q.onDone;
    bonusBones(2);
    if(cb){ const r=rate, f=cb; Q=null; f(r); return; }
    doneModal({art:'🌟', title:'这一轮完成啦！', desc:`答对 ${Q.right} / ${Q.total} 题，正确率 ${rate}%。奖励 2 个骨头 🦴`, next:'go(currentView)'});
    Q=null; return;
  }
  renderQuiz(); renderChrome();
}
function bonusBones(n){ S.bones+=n; S.stats.todayBones+=n; save(); renderChrome(); }
function petCheer(ok){
  const st = $('#tbPet'); if(!st) return;
  st.animate(ok?[{transform:'scale(1)'},{transform:'scale(1.1) rotate(-2deg)'},{transform:'scale(1)'}]
               :[{transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(0)'}],{duration:500});
}

/* ---------------- 逻辑思维 ---------------- */
const SHAPES=['🔴','🔵','🟡','🟢','🟣','🟠'];
let FORCE_LOGIC = null;
let SELECTED = null;
function logicBuild(){
  const t = FORCE_LOGIC || (MODE==='s' ? pick(['pair','diff','class','size'])
          : MODE==='m' ? pick(['pattern','diff','shadow','count'])
          : pick(['pattern','shape','math','puzzle','size','time']));
  if(t==='pair'){ // 图形配对：找出与左边相同的
    const base=pick(SHAPES); const others=sample(SHAPES.filter(s=>s!==base),3);
    const opts=shuffle([base,...others]);
    return {type:'图形配对',prompt:'找出和上面一样的图形',visual:`<span style="font-size:52px">${base}</span>`,options:opts,ans:opts.indexOf(base)};
  }
  if(t==='diff'){ // 找不同：一排里有一个不一样
    const base=pick(['🍎','🐟','🌸','⭐','🚗','🐱']);
    const other=pick(['🍐','🐟','🌼','✨','🚕','🐶'].filter(x=>x!==base));
    const n=MODE==='s'?4:6; const pos=rnd(n);
    const arr=Array.from({length:n},(_,i)=>i===pos?other:base);
    return {type:'找不同',prompt:'哪一个和其他的不一样？',visual:'',options:arr,ans:pos};
  }
  if(t==='class'){ // 分类
    const groups=[{n:'水果',em:['🍎','🍌','🍇','🍓']},{n:'动物',em:['🐶','🐱','🐟','🐰']},{n:'交通',em:['🚗','🚌','✈️','🚲']}];
    const g=pick(groups); const item=pick(g.em);
    const others=groups.filter(x=>x.n!==g.n).map(x=>pick(x.em));
    const opts=shuffle([g.n,...groups.filter(x=>x.n!==g.n).map(x=>x.n)]);
    return {type:'物品分类',prompt:`${item} 属于哪一类？`,visual:`<span style="font-size:52px">${item}</span>`,options:opts,ans:opts.indexOf(g.n)};
  }
  if(t==='size'){ // 大小长短
    const a=3+rnd(6), b=3+rnd(6); if(a===b) return logicBuild();
    return {type:'比大小',prompt:`哪一组更多？`,visual:`${'⭐'.repeat(a)}　　${'⭐'.repeat(b)}`,options:['左边','右边'],ans:a>b?0:1};
  }
  if(t==='pattern'){ // 规律排序
    const unit=sample(SHAPES.slice(0,3),2); const seq=[]; for(let i=0;i<5;i++) seq.push(unit[i%2]);
    const ans=unit[5%2]; const opts=shuffle([...new Set([...SHAPES.slice(0,3)])]).slice(0,3);
    if(!opts.includes(ans)) opts[0]=ans;
    return {type:'规律排序',prompt:`接下来是什么？`,visual:seq.join(' ')+' ❓',options:opts,ans:opts.indexOf(ans)};
  }
  if(t==='shadow'){ // 影子匹配：相同轮廓
    const items=[{e:'🐶',s:'🐕'},{e:'🐱',s:'🐈'},{e:'🦆',s:'🦢'},{e:'🐰',s:'🐇'}];
    const it=pick(items); const opts=shuffle(items).map(x=>x.s);
    return {type:'影子匹配',prompt:`${it.e} 的影子是哪个？`,visual:`<span style="font-size:52px">${it.e}</span>`,options:opts,ans:opts.indexOf(it.s)};
  }
  if(t==='count'){ const n=3+rnd(6); return numericQ(n,2,'数量推理','数一数有几个？','🍬'.repeat(n)); }
  if(t==='math'){ const a=2+rnd(8),b=2+rnd(8); return numericQ(a+b,3,'生活数学',`小明有 ${a} 个苹果，又买了 ${b} 个，一共几个？`,''); }
  if(t==='puzzle'){ const total=5+rnd(5), eaten=1+rnd(3); return numericQ(total-eaten,3,'拼图思维',`${total} 块拼图，用掉 ${eaten} 块，还剩几块？`,'🧩'); }
  const h=pick([1,3,6,9]); const hv=shuffle([h,h+1,h+2,h+3]); return {type:'时间认知',prompt:`钟面上时针指 ${h}、分针指 12，是几点？`,visual:'🕐',options:hv.map(x=>x+'点'),ans:hv.indexOf(h)};
}

function puzzleNew(){
  const sets = MODE==='s'
    ? [['🐣','🐤','🐔','🦚'],['🌱','🌿','🌳','🌲'],['1️⃣','2️⃣','3️⃣','4️⃣']]

    : [['1','2','3','4','5','6','7','8'],['🥚','🐣','🐤','🐔','🦚','🦅','🕊️','🦉']];
  const target = pick(sets);
  let cur = shuffle(target);
  while(cur.join()===target.join()) cur=shuffle(target);
  G.puzzle={target, cur, sel:-1};
  drawPuzzle(head());
}
function head(){ return `<div class="page-head"><h1>${{puzzle:'拼图排序',link:'物品连线',match:'看图配对',pattern:'找规律',shadow:'影子配对'}[G.type]}</h1><span class="sub">第 ${G.level} / ${G.levels} 关</span></div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${(G.level-1)/G.levels*100}%"></i></div>`; }
function drawPuzzle(){
  const {cur,sel}=G.puzzle;
  $('#viewRoot').innerHTML = head()+`
    <div class="card center">
      <p class="muted">点两块交换位置，把它们排成正确顺序</p>

}
function puzzleTap(i){
  const P=G.puzzle;
  if(P.sel<0){ P.sel=i; drawPuzzle(); sfx.pop(); return; }
  if(P.sel===i){ P.sel=-1; drawPuzzle(); return; }
  [P.cur[P.sel],P.cur[i]]=[P.cur[i],P.cur[P.sel]];
  P.sel=-1; sfx.pop(); drawPuzzle();
  if(P.cur.join()===P.target.join()){

function linkNew(){

  const pairs = sample(bank,n);

function drawLink(){
  const L=G.link;

            <button class="btn sm ghost" onclick="speak('${esc(it.d||it.t)}')">念歌词</button>`:''}

  <div class="center"><button class="btn ghost" onclick="tzShift+=(MODE==='s'?3:2);go('tuozhan')">🔄 换一批</button></div>`;

function tellStory(title, desc){
  if(!window.speechSynthesis){ toast('这个浏览器不支持语音朗读'); return; }
  try{
    speechSynthesis.cancel();
    const text = `${title}。${desc}`;
    const parts = text.match(/[^。！？!?，,]+[。！？!?，,]?/g) || [text];
    parts.forEach((seg,i)=>{
      const u=new SpeechSynthesisUtterance(seg.trim());
      u.lang='zh-CN';
      u.rate=(SPEECH_RATE[MODE]||.9)*0.92;
      u.pitch = i%2 ? 1.18 : 0.96;      // 角色感：两句一换音色高低
      const v = pickVoice('zh-CN'); if(v) u.voice=v; else hintNoZhVoice();
      speechSynthesis.speak(u);
      if(i<parts.length-1){
        const gap=new SpeechSynthesisUtterance('…'); gap.lang='zh-CN'; gap.rate=.6;
        speechSynthesis.speak(gap);
      }
    });
    toast('📖 正在分段讲故事，注意听哦');
  }catch(e){ speak(`${title}。${desc}`); }
}

    </div>
  </div>

    <div class="between"><b>打卡日历</b><span class="muted">最近 4 周</span></div>
    ${calendarHtml()}
  </div>`;
};
function toggleTask(i){
  const t=todayKey();
  const arr = S.tasksDone[t] || (S.tasksDone[t]=[]);
  const k = arr.indexOf(i);
  if(k>=0){ arr.splice(k,1); }
  else{ arr.push(i); grant('carrot',{silent:true}); toast('✅ 完成一项，+1 骨头'); sfx.ok(); }
  const tasks=TASKS[MODE];
  if(arr.length>=dailyTasks().length && !allTasksFlag(t)){
    S.checkins.push(t); S.streak = calcStreak();
    bonusBones(1);
    if(S.streak>0 && S.streak%7===0){
      setTimeout(()=>{ sfx.win(); toast(`🏅 连续打卡 ${S.streak} 天！奖励 5 个骨头`,2600); bonusBones(5); }, 900);
    } else {
      sfx.win(); toast('🎉 今日全部完成，打卡成功！+1 骨头');
    }
  }
  save(); renderChrome(); go('daka');
}
function allTasksFlag(t){ return S.checkins.includes(t); }
function calcStreak(){
  let n=0; const d=new Date();
  for(;;){
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(S.checkins.includes(k)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function calendarHtml(){
  const cells=[]; const d=new Date();
  const start=new Date(d); start.setDate(d.getDate()-27);
  const wd=['日','一','二','三','四','五','六'];
  cells.push(...wd.map(w=>`<div class="cal-head">${w}</div>`));
  for(let i=0;i<28;i++){
    const day=new Date(start); day.setDate(start.getDate()+i);
    const k=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
    const done=S.checkins.includes(k), isToday=k===todayKey();
    cells.push(`<div class="cal-cell ${done?'done':''} ${isToday?'today':''}">${day.getDate()}</div>`);
  }
  return `<div class="calendar">${cells.join('')}</div>`;
}

GK_DATA.chars.forEach(c=>{
  const st=GK_DATA.strokes[c.c];
  c.m=(st&&st.m)||[]; c.n=(st&&st.n)||c.m.length;
  // 统一缩放居中到 12..88 的格子里
  const pts=c.m.flat(); if(!pts.length) return;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const w=Math.max(x1-x0,1), h=Math.max(y1-y0,1);
  const k=76/Math.max(w,h);
  const ox=50-(x0+w/2)*k, oy=50-(y0+h/2)*k;
  c.m=c.m.map(s=>s.map(p=>[+(p[0]*k+ox).toFixed(1), +(p[1]*k+oy).toFixed(1)]));
});
const GK_UNIT_SIZE = 10;
/* 一关 = 一周：小班 4 字、中班 10 字、大班 10 字 */
function gkSize(){ return ({s:4, m:10, l:10})[MODE] || 10; }
const GK = { unit: 0, ch: null, stroke: 0, trail: [], drawing: false, done: false };

/* 按档位切分：小班 1-5 画(16关) / 中班 6-9 画(43关) / 大班 10 画以上(39关) */
function gkBandMap(){
  if(!S.gk) S.gk = {};
  if(!S.gk.s){ S.gk = { s:{}, m:{}, l:{} }; }   // 旧数据迁移
  if(!S.gk[MODE]) S.gk[MODE] = {};
  return S.gk[MODE];
}
function gkLearned(c){ return !!gkBandMap()[c]; }
function gkUnits(){
  const band = GK_BANDS[MODE] || [1,99];
  const arr = GK_DATA.chars.filter(c=>c.n>=band[0] && c.n<=band[1]);
  const out = [];
  const SZ = gkSize();
  for(let i=0;i<arr.length;i+=SZ) out.push(arr.slice(i,i+SZ));
  return out;
}
function gkUnitDone(u){ return u.every(c=>gkLearned(c.c)); }
function gkCurrentUnit(){
  gkBandMap();
  for(let i=0;i<gkUnits().length;i++) if(!gkUnitDone(gkUnits()[i])) return i;
  return gkUnits().length-1;
}
function gkUnitLearned(u){ return u.filter(c=>gkLearned(c.c)).length; }

/* ---------------- 单元地图 ---------------- */
VIEWS.guanka = function(){
  const idx = gkCurrentUnit();
  const total = gkUnits().length;
  const bandChars = gkUnits().flat();
  const learned = bandChars.filter(c=>gkLearned(c.c)).length;
  const cur = gkUnits()[idx];
  const curDone = gkUnitLearned(cur);
  const nextUnit = gkUnits()[idx+1];
  const prevUnit = gkUnits()[idx-1];
  const pct = Math.round(learned/bandChars.length*100);
  return `
  <div class="hero">
    <div class="hero-art">📖</div>
    <h2>识字启蒙</h2>
    <p>${MODE_NAME[MODE]} · 按笔画从易到难，共 ${total} 关 · 每关 ${gkSize()} 个字（正好一周）<br>已学 ${learned} / ${bandChars.length} 个字（${pct}%）</p>
    <div class="hero-bar"><i style="width:${pct}%"></i></div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="between"><b style="font-size:16px">📅 本周计划（第 ${idx+1} 周）</b><span class="pill">一关 = 一周</span></div>
    ${weekStrip([...cur.map(c=>c.c), '复习', '复习', '抽考'], (i)=> i<cur.length && gkLearned(cur[i].c))}
    <div class="muted" style="margin-top:10px;font-size:13px">周一到周四每天学 1 个字（约 5 分钟），周五、周六复习，周日抽考。</div>
  </div>
  <div class="sec-title">第 ${idx+1} 周 · 这周要学的字</div>
  <div class="card gk-unit" onclick="gkOpenUnit(${idx})">
    <div class="gk-badge">${idx+1}</div>
    <div class="gk-info">
      <b>${cur.map(c=>c.c).join(' ')}</b>
      <small>${curDone}/${cur.length} 个 · 笔画 ${cur[0].n}～${cur[cur.length-1].n} 画</small>
      <div class="gk-bar"><i style="width:${Math.round(curDone/cur.length*100)}%"></i></div>
    </div>
    <div class="gk-go">开始 ›</div>
  </div>

  ${nextUnit?`
  <div class="card gk-unit locked">
    <div class="gk-badge">${idx+2}</div>
    <div class="gk-info"><b>${nextUnit.map(c=>c.c).join(' ')}</b><small>学完第 ${idx+1} 周解锁</small></div>
    <div class="gk-go">🔒</div>
  </div>`:''}

  ${prevUnit?`
  <div class="card gk-unit" onclick="gkOpenUnit(${idx-1})">
    <div class="gk-badge">✓</div>

};
function gkOpenChar(c){
  GK.ch = GK_DATA.chars.find(x=>x.c===c);

  go('gkchar');
}

      </div>

  }

  if(slot==='写') gkBindTrace();

function gkStep(n){ GK.step=n; const sl=gkSlots(GK.ch); if(sl[n]==='写'){ GK.stroke=0; GK.trail=[]; } renderChrome(); gkRender(); }
function gkNext(){ GK.step=(GK.step||0)+1; const sl=gkSlots(GK.ch); if(sl[GK.step]==='写'){ GK.stroke=0; GK.trail=[]; } renderChrome(); gkRender(); }
function gkGoto(name){ const sl=gkSlots(GK.ch); const i=sl.indexOf(name); GK.step=i<0?0:i; if(name==='写'){ GK.stroke=0; GK.trail=[]; } renderChrome(); gkRender(); }
