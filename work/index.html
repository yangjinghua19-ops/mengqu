function gkBindTrace(){
  const svg = document.getElementById('gkSvg');
  if(!svg) return;
  GK.trail=[]; GK.stroke=0; GK.done=false;
  document.getElementById('gkTrail').setAttribute('points','');
  gkPrepare(); gkDrawGuides();
  const toLocal = (ev)=>{
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left)/r.width*100;
    const y = (ev.clientY - r.top)/r.height*100;
    return [Math.max(0,Math.min(100,x)), Math.max(0,Math.min(100,y))];
  };
  svg.addEventListener('pointerdown', ev=>{
    ev.preventDefault(); svg.setPointerCapture(ev.pointerId);
    GK.drawing = true; GK.trail = [toLocal(ev)];
  });
  svg.addEventListener('pointermove', ev=>{
    if(!GK.drawing) return;
    GK.trail.push(toLocal(ev));
    document.getElementById('gkTrail').setAttribute('points', GK.trail.map(p=>p.join(',')).join(' '));
  });
  svg.addEventListener('pointerup', ()=>{ if(!GK.drawing) return; GK.drawing=false; gkCheckStroke(); });
  svg.addEventListener('pointercancel', ()=>{ GK.drawing=false; });
  speak('写'+GK.ch.c);
}
function gkPrepare(){ GK.mm = (GK.ch && GK.ch.m) || []; }

function gkDrawGuides(){
  const g = document.getElementById('gkGuides');

  const mm = GK.mm || GK.ch.m;
  // 底稿：整字骨架，粗一点、很浅
  base.innerHTML = mm.map(st=>`<polyline points="${st.map(p=>p.join(',')).join(' ')}"
    fill="none" stroke="#e8eee9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  // 当前笔粉色虚线 + 已完成绿色
  g.innerHTML = mm.map((st,i)=>{
    if(i < GK.stroke){
      return `<polyline points="${st.map(p=>p.join(',')).join(' ')}" fill="none"
        stroke="#a7dcb7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
    }

    }, i*600);

function gkDistPointSeg(p, a, b){
  const vx=b[0]-a[0], vy=b[1]-a[1], wx=p[0]-a[0], wy=p[1]-a[1];
  const L=vx*vx+vy*vy || 1;
  let t=(wx*vx+wy*vy)/L; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy));
}
function gkCheckStroke(){
  const mm = GK.mm || GK.ch.m;
  const st = mm[GK.stroke] || [], trail = GK.trail;
  if(trail.length < 4){ document.getElementById('gkHint').textContent='再描一次，从红点开始一直描到结尾'; return; }
  const samples=[];
  for(let i=0;i<st.length-1;i++){
    const a=st[i], b=st[i+1];
    const n=Math.max(2, Math.round(Math.hypot(b[0]-a[0], b[1]-a[1])/3));
    for(let k=0;k<=n;k++) samples.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]);
  }
  let hit=0;
  samples.forEach(pt=>{
    let best=1e9;
    for(let i=0;i<trail.length-1;i++) best=Math.min(best, gkDistPointSeg(pt, trail[i], trail[i+1]));
    if(best<12) hit++;
  });
  const cover = hit/Math.max(1,samples.length);
  if(cover>=0.7){
    GK.stroke++;
    document.getElementById('gkTrail').setAttribute('points',''); GK.trail=[];
    if(GK.stroke>=GK.ch.n){ gkGoto('找'); return; }
    gkDrawGuides();
    document.getElementById('gkHint').textContent=`对了！接着写第 ${GK.stroke+1} 笔`;
  } else {
    document.getElementById('gkTrail').setAttribute('points',''); GK.trail=[];
    document.getElementById('gkHint').textContent=`这一笔还差一点，跟着虚线再描一次`;
  }
}

}

/* ===== 算术天地：10 关阶梯 ===== */
function mCount(max){ const n=1+rnd(max); const em=pick(['🍎','🍓','🐟','⭐','🌸','🐰']);
  return numericQ(n, 2, '数一数', `数一数，有几个${em}？`, em.repeat(n)); }
function mCmp(max){ let a=1+rnd(max), b=1+rnd(max); if(a===b) b=a+1;
  const opts=['大','小'];
  return {type:'比大小', prompt:`${a} 和 ${b}，哪个数字更大？`, visual:`${a}　${b}`, options:opts, ans:a>b?0:1}; }
function mAdd(max, label){ const a=1+rnd(max-1), b=1+rnd(max-a);
  return numericQ(a+b, 2, label, `${a} + ${b} = ?`, `${'🍎'.repeat(Math.min(a,10))} ➕ ${'🍎'.repeat(Math.min(b,10))}`); }
function mSub(max, label){ const a=2+rnd(max-1), b=1+rnd(a-1);
  return numericQ(a-b, 2, label, `${a} - ${b} = ?`, `${'🍓'.repeat(Math.min(a,10))} 拿走 ${b} 个`); }
function mShape(){ const all=[{n:'圆形',e:'⚪'},{n:'正方形',e:'🟥'},{n:'三角形',e:'🔺'},{n:'长方形',e:'▭'}];
  const sh=pick(all); const opts=shuffle([sh,...shuffle(all.filter(x=>x.n!==sh.n)).slice(0,2)]);
  return {type:'认图形', prompt:'这是什么形状？', visual:`<span style="font-size:64px">${sh.e}</span>`,
    options:opts.map(o=>o.n), ans:opts.findIndex(o=>o.n===sh.n)}; }

  }
  LV.mod='yingyu'; go('lv');
  Q = { key:'yingyu', food:'dew', title:'英语复习', idx:0, right:0, total:list.length, list,
    onDone:(rate)=>doneModal({art: rate>=60?'🔁':'💛', title: rate>=60?'复习通过！':'再复习一次吧',
      desc:'学过的东西最容易忘，多念两遍就记住了', next:"go('yingyu')"}) };
  renderQuiz();
}


/* ===== 算术 / 逻辑：小节制（每关 4 节，一周 1 节） ===== */
const SEC_PER_UNIT = 4;
function secWeekKey(){ const d=new Date(); const off=(d.getDay()+6)%7; const m=new Date(d.getTime()-off*86400000); return m.toISOString().slice(0,10); }
function secState(mod){
  if(!S.sec) S.sec={};
  const st = S.sec[mod] || (S.sec[mod]={n:0, week:''});
  const total = lvLevels(mod).length*SEC_PER_UNIT;
  const n = Math.min(st.n||0, total);
  const wk = secWeekKey();
  return {n, total, unit: Math.floor(n/SEC_PER_UNIT), sec: n%SEC_PER_UNIT, wk, can: st.week!==wk, used: st.week===wk};
}
function secHome(mod){
  const d=LVDATA[mod], levels=lvLevels(mod), st=secState(mod);
  const finished = st.n>=st.total;
  const lv = levels[Math.min(st.unit, levels.length-1)];
  const isExam = st.sec===SEC_PER_UNIT-1;
  const qn = isExam?6:3;
  const dots = Array.from({length:SEC_PER_UNIT},(_,k)=>{
    const cls = k<st.sec ? 'on' : (k===st.sec?'now':'');
    return `<i class="sec-dot ${cls}"></i>`;
  }).join('');
  return `
  <div class="hero">
    <div class="hero-art">${d.ic}</div>
    <h2>${d.name}闯关</h2>
    <p>${MODE_NAME[MODE]} · ${levels.length} 关，每关 4 节，一周 1 节<br>已学 ${st.n} / ${st.total} 节</p>
    <div class="hero-bar"><i style="width:${Math.round(st.n/st.total*100)}%"></i></div>
  </div>
  ${finished ? `<div class="card center"><div style="font-size:44px">🏆</div><b>全部学完啦</b><p class="muted">可以自由复习任意小节</p></div>` : `
  <div class="card gk-unit" onclick="${st.can?`secOpen('${mod}')`:''}" style="${st.can?'':'opacity:.62'}">
    <div class="gk-badge" style="background:var(--green);color:#fff">${st.unit+1}</div>
    <div class="gk-info">
      <b>第 ${st.unit+1} 关 · 第 ${st.sec+1}/4 节${isExam?' · 小考':''}</b>
      <small>${lv.t} · ${qn} 道题 · 约 ${qn===6?'4':'2'} 分钟</small>
      <div class="sec-dots">${dots}</div>
    </div>
    <div class="gk-go">${st.can?'开始 ›':'下周 ›'}</div>
  </div>`}
  <div class="card tight">
    <div class="row" style="justify-content:space-between"><span class="muted">本周节奏</span><span class="pill">一周 1 节</span></div>
    <div class="muted" style="font-size:13px;line-height:1.7;margin-top:6px">每关 4 节：前 3 节各 3 道题，第 4 节是小考（6 道题，对 5 道算过）。一关过完得 1 颗星，全关学完约 ${levels.length*SEC_PER_UNIT} 周。</div>
  </div>
  <div class="note">${st.can?'今天的小节做完就可以休息，明天再来复习字卡和英语。':'这周的已经做完啦，下周再学新的一节。'}</div>`;
}
function secOpen(mod){ LV.mod=mod; LV.i=secState(mod).unit; LV.phase='quiz'; go('lv'); }
function secQuiz(){
  const d=LVDATA[LV.mod], st=secState(LV.mod), lv=lvLevels(LV.mod)[LV.i];
  const isExam = st.sec===SEC_PER_UNIT-1;
  const qn = isExam?6:3;
  const list = Array.from({length:qn},()=>lv.gen());
  go('lv');
  Q = { key:LV.mod, food:d.food, title:`${d.name} · 第 ${LV.i+1} 关 · 第 ${st.sec+1} 节`, idx:0, right:0, total:list.length, list,
    onDone:(rate)=>{
      const need = isExam?84:60;
      const pass = rate>=need;
      if(pass){
        const stt=S.sec[LV.mod]; stt.n=(stt.n||0)+1; stt.week=secWeekKey();
        S.bones+=3;
        if(isExam){ S.stars=(S.stars||0)+1; }
        goalAdd(LV.mod==='math'?'math':'luoji');
        save();
        if(LV.mod==='math' && currentView==='suan') goalAdd('math');
      }
      doneModal({art: pass?'⭐':'💛', title: pass?'这一节过啦！':`差一点（${rate}%）`,
        desc: pass? (isExam?'这一关学完，+3 骨头 +1 颗星':'+3 根骨头，下周再学下一节') : '再来一次就好，不着急',
        next: pass?`go('${LV.mod==='math'?'suan':'luoji'}')`:`secOpen('${LV.mod}')`});
    }};
  renderQuiz();
}
VIEWS.suan = ()=>secHome('math');
VIEWS.luoji = ()=>secHome('luoji');
const _lvOpen = lvOpen;
lvOpen = function(mod,i){ if(mod==='math'||mod==='luoji'){ LV.mod=mod; LV.i=i; go('lv'); return; } return _lvOpen(mod,i); };


/* ---- 找规律 ---- */
const PAT_BANK = {
  s:[['🍎','🍌'],['🔴','🔵'],['🐱','🐶']],
  m:[['🍎','🍌','🍇'],['🔴','🔵','🟡'],['🐱','🐶','🐰']],
  l:[['🍎','🍌','🍇'],['🔴','🔵','🟡'],['🐱','🐶','🐰'],['⭐','🌙','☀️']]
};
function patternNew(){
  const bank = PAT_BANK[MODE] || PAT_BANK.s;
  const set = pick(bank);
  const reps = MODE==='s'?3:4;
  const seq = [];
  for(let r=0;r<reps;r++) set.forEach(e=>seq.push(e));
  const cut = seq.length - 1;
  const ans = seq[cut];
  const shown = seq.slice(0, cut);
  const opts = shuffle([ans, ...set.filter(e=>e!==ans)]).slice(0,3);
  if(!opts.includes(ans)) opts[0]=ans;
  const shuffled = shuffle(opts);
  G.pattern = {shown, ans, opts: shuffled};
  drawPattern();
}
function drawPattern(){
  const P=G.pattern;
  $('#viewRoot').innerHTML = head()+`
    <div class="card center">
      <p class="muted">接下来应该是什么？</p>
      <div style="font-size:38px;letter-spacing:6px;margin:18px 0;line-height:1.5">${P.shown.join('')}<span style="opacity:.35">？</span></div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:8px">
        ${P.opts.map((e,i)=>`<button class="tile" style="min-height:74px;font-size:34px" onclick="patternTap(${i})">${e}</button>`).join('')}
      </div>
    </div>`;
}
function patternTap(i){
  const P=G.pattern;
  if(P.opts[i]===P.ans){ sfx.good(); G.level++; renderGame(); }
  else { sfx.bad(); toast('再看看前面的样子 🙂'); }
}

/* ---- 影子配对 ---- */
const SHADOW_BANK = ['🍎','🐟','🌸','⭐','🚗','🐱','🎈','🍓','🦋','🌳'];
function shadowNew(){
  const n = MODE==='s'?2:3;
  const items = sample(SHADOW_BANK, n+1);
  const target = items[0];
  const opts = shuffle(items);
  G.shadow = {target, opts};
  drawShadow();
}
function drawShadow(){
  const S2=G.shadow;
  $('#viewRoot').innerHTML = head()+`
    <div class="card center">
      <p class="muted">哪一个和上面的图形一样？</p>
      <div style="font-size:64px;margin:12px 0">${S2.target}</div>
      <div class="grid" style="grid-template-columns:repeat(${S2.opts.length},1fr);gap:10px">
        ${S2.opts.map((e,i)=>`<button class="tile" style="min-height:80px;font-size:40px" onclick="shadowTap(${i})"><span style="filter:brightness(0);opacity:.55">${e}</span></button>`).join('')}
      </div>
    </div>`;
}
function shadowTap(i){
  const S2=G.shadow;
  if(S2.opts[i]===S2.target){ sfx.good(); G.level++; renderGame(); }
  else { sfx.bad(); toast('影子是黑黑的，看形状哦 🙂'); }
}

boot();
</script>
